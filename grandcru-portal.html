<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:#FAF6EE;font-family:'Cormorant Garamond',serif;min-height:100vh;}
:root{
  --wine:#6B1A2A;--wineD:#4A0E1C;--wineL:#8B2A3F;
  --gold:#C9A84C;--goldL:#E8C96B;
  --cream:#F5EFE0;--creamD:#EDE3CC;--warm:#FAF6EE;
  --charcoal:#2C2018;--muted:#8C7B6B;--brick:#B85C38;
}
button{cursor:pointer;font-family:'Cormorant Garamond',serif;}
input,select,textarea{font-family:'Cormorant Garamond',serif;}
#app{max-width:430px;margin:0 auto;min-height:100vh;position:relative;}

/* ── LOADING ── */
#loading{position:fixed;inset:0;background:var(--wineD);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;}
#loading .logo{color:var(--cream);font-family:'Playfair Display',serif;font-size:32px;font-weight:700;letter-spacing:4px;}
#loading .sub{color:var(--gold);font-size:11px;letter-spacing:6px;margin-top:8px;}
.spinner{width:32px;height:32px;border:2px solid rgba(201,168,76,0.2);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin-top:24px;}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── TOPBAR ── */
#topbar{background:linear-gradient(90deg,var(--wineD),var(--wine));padding:10px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(201,168,76,0.3);position:sticky;top:0;z-index:100;}
.topbar-logo{color:var(--gold);font-size:10px;letter-spacing:5px;}
.topbar-points{display:flex;align-items:center;gap:6px;background:rgba(201,168,76,0.15);border:1px solid rgba(201,168,76,0.3);border-radius:3px;padding:4px 12px;color:var(--cream);font-family:'Playfair Display',serif;font-weight:700;}

/* ── BOTTOM NAV ── */
#botnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--wineD);border-top:1px solid rgba(201,168,76,0.3);display:flex;justify-content:space-around;padding:6px 0 10px;z-index:200;}
.navbtn{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:2px 4px;opacity:0.45;transition:opacity .2s;}
.navbtn.active{opacity:1;}
.navbtn .nav-ic{font-size:16px;color:var(--cream);}
.navbtn.active .nav-ic{color:var(--gold);}
.navbtn .nav-lbl{font-size:8px;letter-spacing:0.5px;font-weight:600;color:var(--cream);}
.navbtn.active .nav-lbl{color:var(--gold);}
.navbtn .nav-dot{width:14px;height:1px;background:var(--gold);display:none;}
.navbtn.active .nav-dot{display:block;}
.nav-badge{position:absolute;top:-4px;right:-6px;background:#e53935;color:#fff;border-radius:10px;font-size:9px;font-weight:700;min-width:16px;height:16px;display:flex;align-items:center;justify-content:center;padding:0 4px;line-height:1;}
.nav-ic-wrap{position:relative;display:inline-flex;}

/* ── GOLD DIVIDER ── */
.gold-div{display:flex;align-items:center;gap:10;margin:14px 0;}
.gold-div::before,.gold-div::after{content:'';flex:1;height:1px;}
.gold-div::before{background:linear-gradient(to right,transparent,var(--gold));}
.gold-div::after{background:linear-gradient(to left,transparent,var(--gold));}
.gold-div-diamond{width:5px;height:5px;background:var(--gold);transform:rotate(45deg);flex-shrink:0;}

/* ── MONOGRAM ── */
.mono{border-radius:50%;background:linear-gradient(135deg,var(--wine),var(--wineD));border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;color:var(--goldL);font-family:'Playfair Display',serif;font-weight:700;letter-spacing:2px;flex-shrink:0;}

/* ── PAGES ── */
.page{padding:24px 20px 100px;min-height:100vh;display:none;}
.page.active{display:block;}

/* ── CARDS ── */
.card{background:#fff;border-radius:6px;border:1px solid var(--creamD);margin-bottom:10px;overflow:hidden;}
.card-pad{padding:14px 18px;}

/* ── LOGIN ── */
#login-page{min-height:100vh;background:linear-gradient(170deg,var(--wineD) 0%,var(--wine) 55%,#3D0F1C 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;}
.login-title{text-align:center;margin-bottom:36px;}
.login-title .rest-label{color:var(--gold);font-size:11px;letter-spacing:6px;margin-bottom:6px;}
.login-title h1{color:var(--cream);font-family:'Playfair Display',serif;font-size:36px;font-weight:700;letter-spacing:4px;line-height:1;}
.login-title .portal-label{color:rgba(245,239,224,0.5);font-size:13px;letter-spacing:3px;margin-top:8px;}
.emp-btn{width:100%;background:rgba(245,239,224,0.07);border:1px solid rgba(201,168,76,0.25);border-radius:4px;padding:14px 18px;display:flex;align-items:center;gap:14px;margin-bottom:10px;transition:background .2s;}
.emp-btn:hover{background:rgba(245,239,224,0.12);}
.emp-name{color:var(--cream);font-weight:700;font-size:17px;font-family:'Playfair Display',serif;text-align:left;}
.emp-role{color:var(--gold);font-size:11px;letter-spacing:2px;opacity:.8;text-align:left;}
.pin-dots{display:flex;justify-content:center;gap:16px;margin-bottom:32px;}
.pin-dot{width:14px;height:14px;border-radius:50%;background:transparent;border:2px solid var(--gold);transition:all .15s;}
.pin-dot.filled{background:var(--gold);}
.pin-dot.error{background:#e53935;border-color:#e53935;}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.num-btn{background:rgba(245,239,224,0.08);border:1px solid rgba(201,168,76,0.2);border-radius:4px;padding:16px 0;color:var(--cream);font-size:22px;font-weight:600;font-family:'Playfair Display',serif;}
.num-btn:hover{background:rgba(245,239,224,0.14);}
.num-btn.empty{background:transparent;border:none;}
.num-back{font-size:18px;}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.shake{animation:shake .4s;}

/* ── HOME PAGE ── */
.hero-card{background:linear-gradient(135deg,var(--wine),var(--wineD));border-radius:6px;padding:24px 22px;margin-bottom:20px;border:1px solid rgba(201,168,76,0.3);position:relative;overflow:hidden;}
.hero-card::after{content:'';position:absolute;right:-20px;top:-20px;width:120px;height:120px;border-radius:50%;background:rgba(201,168,76,0.06);}
.shift-badge{background:rgba(201,168,76,0.15);border:1px solid rgba(201,168,76,0.4);border-radius:4px;padding:8px 14px;display:inline-flex;gap:8px;align-items:center;color:var(--cream);font-size:14px;letter-spacing:1px;}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;}
.stat-card{background:#fff;border-radius:6px;padding:18px 16px;border:1px solid var(--creamD);text-align:center;cursor:pointer;}
.stat-icon{font-size:22px;margin-bottom:6px;}
.stat-val{font-size:30px;font-weight:700;color:var(--charcoal);font-family:'Playfair Display',serif;}
.stat-lbl{font-size:10px;letter-spacing:3px;color:var(--muted);margin-top:4px;}
.task-row{background:#fff;border-radius:6px;padding:14px 16px;margin-bottom:8px;display:flex;align-items:center;gap:12px;border:1px solid var(--creamD);cursor:pointer;}
.task-bar{width:4px;align-self:stretch;border-radius:4px;}
.task-title{font-weight:600;font-size:15px;color:var(--charcoal);font-family:'Playfair Display',serif;}
.task-desc{font-size:12px;color:var(--muted);margin-top:2px;}

/* ── SHIFTS PAGE ── */
.week-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.week-navbtn{background:#fff;border:1px solid var(--creamD);border-radius:4px;width:32px;height:32px;color:var(--wine);font-size:16px;font-family:'Playfair Display',serif;}
.week-navbtn.today-btn{padding:0 12px;width:auto;font-size:12px;font-weight:700;letter-spacing:1px;}
.week-navbtn.today-btn.active{background:var(--wine);color:var(--cream);}
.day-card{margin-bottom:10px;border-radius:6px;overflow:hidden;}
.day-header{padding:9px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--creamD);}
.day-header.today{background:linear-gradient(90deg,var(--wine),var(--wineL));border-color:rgba(201,168,76,0.44);}
.day-header.weekend{background:var(--creamD);}
.day-header.normal{background:#fff;}
.day-title{font-family:'Playfair Display',serif;font-weight:700;font-size:14px;color:var(--charcoal);}
.day-header.today .day-title{color:var(--cream);}
.today-badge{background:rgba(201,168,76,0.3);color:var(--goldL);font-size:9px;letter-spacing:3px;border-radius:2px;padding:2px 8px;}
.mine-badge{margin-left:auto;background:rgba(107,26,42,0.12);color:var(--wine);font-size:9px;letter-spacing:2px;border-radius:2px;padding:2px 8px;}
.shift-row{display:flex;align-items:center;padding:9px 14px;border-bottom:1px solid var(--creamD);}
.shift-row:last-child{border-bottom:none;}
.shift-row.mine{background:rgba(107,26,42,0.05);border-left:3px solid var(--gold);}
.shift-row:not(.mine){border-left:3px solid transparent;}
.shift-emp{width:82px;font-family:'Cormorant Garamond',serif;font-size:15px;color:var(--muted);}
.shift-row.mine .shift-emp{font-weight:700;color:var(--wine);}
.shift-time{color:var(--charcoal);font-size:13px;}
.shift-dur{margin-left:auto;font-size:11px;color:var(--gold);}
.no-shifts{padding:10px 14px;color:var(--muted);font-size:12px;letter-spacing:1px;}

/* ── TASKS PAGE ── */
.pri-badge{display:inline-block;border-radius:3px;padding:3px 12px;font-size:10px;letter-spacing:3px;margin-bottom:14px;}
.done-row{background:#fafafa;border-radius:6px;padding:13px 16px;margin-bottom:8px;display:flex;align-items:center;gap:12px;border:1px solid #eee;opacity:.7;cursor:pointer;}

/* ── PROFILE PAGE ── */
.profile-hero{background:linear-gradient(160deg,var(--wineD),var(--wine));border-radius:6px;padding:28px 22px;text-align:center;margin-bottom:20px;border:1px solid rgba(201,168,76,0.25);}
.prog-bar-bg{background:var(--creamD);border-radius:10px;height:6px;overflow:hidden;}
.prog-bar{height:100%;border-radius:10px;background:linear-gradient(90deg,var(--wine),var(--gold));transition:width .6s;}
.logout-btn{width:100%;padding:15px 0;border-radius:4px;background:none;border:1px solid var(--creamD);color:var(--muted);font-size:11px;letter-spacing:4px;}

/* ── TASK DETAIL ── */
#task-detail{position:fixed;inset:0;background:var(--warm);z-index:300;padding:24px 20px 100px;overflow-y:auto;display:none;max-width:430px;margin:0 auto;}
#task-detail.open{display:block;}
.back-btn{background:none;border:1px solid var(--creamD);border-radius:4px;padding:7px 16px;color:var(--wine);font-size:13px;letter-spacing:2px;margin-bottom:20px;}
.complete-btn{width:100%;padding:16px 0;border-radius:4px;border:none;font-size:13px;font-weight:700;letter-spacing:3px;font-family:'Cormorant Garamond',serif;}
.complete-btn.todo{background:linear-gradient(135deg,var(--wine),var(--wineD));color:var(--cream);border:1px solid rgba(201,168,76,0.44);}
.complete-btn.done{background:#fff;color:var(--wine);border:1px solid var(--creamD);}

/* ── SECTION TITLE ── */
.sec-title{font-size:10px;letter-spacing:4px;color:var(--muted);margin:0 0 10px;}

/* ── TOAST ── */
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--wine);color:var(--cream);padding:10px 20px;border-radius:6px;font-size:13px;letter-spacing:1px;z-index:999;display:none;white-space:nowrap;}
</style>

<body>
<div id="loading">
  <div class="logo">GRAND CRU</div>
  <div class="sub">PORTÁL ZAMĚSTNANCŮ</div>
  <div class="spinner"></div>
</div>

<div id="app" style="display:none;">

<!-- LOGIN -->
<div id="login-page">
  <div class="login-title">
    <div class="rest-label">RESTAURANT ET BAR</div>
    <h1>GRAND CRU</h1>
    <div style="display:flex;align-items:center;gap:10px;margin:12px 0;">
      <div style="flex:1;height:1px;background:linear-gradient(to right,transparent,var(--gold))"></div>
      <div style="width:5px;height:5px;background:var(--gold);transform:rotate(45deg)"></div>
      <div style="flex:1;height:1px;background:linear-gradient(to left,transparent,var(--gold))"></div>
    </div>
    <div class="portal-label">PORTÁL ZAMĚSTNANCŮ</div>
  </div>

  <div id="emp-list" style="width:100%;max-width:340px;"></div>

  <div id="pin-panel" style="display:none;width:100%;max-width:300px;text-align:center;">
    <button onclick="showEmpList()" style="background:none;border:none;color:rgba(245,239,224,0.5);font-size:14px;letter-spacing:2px;margin-bottom:24px;">‹ ZPĚT</button>
    <div id="pin-name" style="color:var(--cream);font-family:'Playfair Display',serif;font-size:22px;margin-bottom:4px;"></div>
    <div id="pin-role" style="color:var(--gold);font-size:11px;letter-spacing:4px;margin-bottom:28px;"></div>
    <div id="pin-dots" class="pin-dots"></div>
    <div class="numpad">
      <button class="num-btn" onclick="pressPin('1')">1</button>

<script>
// ══════════════════════════════════════════════════════
// FIREBASE CONFIG — nahraďte svými hodnotami z Firebase Console
// ══════════════════════════════════════════════════════
const firebaseConfig = {
  apiKey: "AIzaSyDRUAXfrrc7iR8SF3qesLnm08UhJjcdFn8",
  authDomain: "crand-cru.firebaseapp.com",
  projectId: "crand-cru",
  storageBucket: "crand-cru.firebasestorage.app",
  messagingSenderId: "190208792561",
  appId: "1:190208792561:web:063313b60c4642a8f55650"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ══════════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════════
let currentEmp = null;
let appData = null;
let weekOffset = 0;
let currentTaskId = null;
let unsubscribe = null;

const DAYS_CZ   = ["Ne","Po","Út","St","Čt","Pá","So"];
const MONTHS_CZ = ["ledna","února","března","dubna","května","června","července","srpna","září","října","listopadu","prosince"];

function fmtDate(d){ return d.toISOString().split("T")[0]; }
function getWeekDates(offset){
  const now=new Date(), dow=now.getDay();
  const mon=new Date(now);
  mon.setDate(now.getDate()-(dow===0?6:dow-1)+offset*7);
  return Array.from({length:7},(_,i)=>{ const d=new Date(mon); d.setDate(mon.getDate()+i); return d; });
}

// ══════════════════════════════════════════════════════
// FIRESTORE LISTENER
// ══════════════════════════════════════════════════════
function startListener(){
  if(unsubscribe) unsubscribe();
  unsubscribe = db.collection("grandcru").doc("data").onSnapshot(snap=>{
    if(snap.exists){
      appData = snap.data();
      if(currentEmp){
        currentEmp = appData.employees.find(e=>e.id===currentEmp.id) || currentEmp;
        refreshAll();
      }
    }
  }, err => { console.error("Firestore error:", err); showToast("Chyba připojení"); });
}

async function saveToFirestore(data){
  try{
    await db.collection("grandcru").doc("data").set(data);
  }catch(e){ showToast("Chyba uložení"); }
}

// ══════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════
window.addEventListener("load", async ()=>{
  startListener();
  // Wait for first load
  await new Promise(r=>{
    const unsub = db.collection("grandcru").doc("data").onSnapshot(snap=>{
      if(snap.exists){ appData=snap.data(); }
      unsub(); r();
    });
  });
  document.getElementById("loading").style.display="none";
  document.getElementById("app").style.display="block";
  renderEmpList();
});

// ══════════════════════════════════════════════════════
// LOGIN
// ══════════════════════════════════════════════════════
let pinBuffer = "";
let selectedEmpId = null;

function renderEmpList(){
  const list = document.getElementById("emp-list");
  if(!appData||!appData.employees){ list.innerHTML='<div style="color:rgba(245,239,224,0.5);text-align:center;">Načítám...</div>'; return; }
  list.innerHTML = `<div style="color:rgba(245,239,224,0.5);font-size:11px;letter-spacing:4px;text-align:center;margin-bottom:16px;">VYBERTE PROFIL</div>` +
    appData.employees.map(e=>`
    <button class="emp-btn" onclick="selectEmp(${e.id})">
      <div class="mono" style="width:44px;height:44px;font-size:13px;">${e.initials}</div>
      <div>
        <div class="emp-name">${e.name}</div>
        <div class="emp-role">${e.role.toUpperCase()}</div>
      </div>
      <span style="margin-left:auto;color:var(--gold);font-size:20px;opacity:.6;">›</span>
    </button>`).join("");
}

function selectEmp(id){
  selectedEmpId = id;
  pinBuffer = "";
  const emp = appData.employees.find(e=>e.id===id);
  document.getElementById("pin-name").textContent = emp.name;
  document.getElementById("pin-role").textContent = emp.role.toUpperCase();
  document.getElementById("emp-list").style.display="none";
  document.getElementById("pin-panel").style.display="block";
  renderPinDots(false);
}

function showEmpList(){
  document.getElementById("emp-list").style.display="block";
  document.getElementById("pin-panel").style.display="none";
  pinBuffer=""; selectedEmpId=null;
}

function renderPinDots(error){
  const dots = document.getElementById("pin-dots");
  dots.innerHTML = [0,1,2,3].map(i=>`<div class="pin-dot${error?" error":pinBuffer.length>i?" filled":""}"></div>`).join("");
}

function pressPin(d){
  if(d==="back"){ pinBuffer=pinBuffer.slice(0,-1); renderPinDots(false); return; }
  if(pinBuffer.length>=4) return;
  pinBuffer+=d; renderPinDots(false);
  if(pinBuffer.length===4){
    setTimeout(()=>{
      const emp = appData.employees.find(e=>e.id===selectedEmpId&&e.pin===pinBuffer);
      if(emp){ loginAs(emp); }
      else{
        renderPinDots(true);
        document.getElementById("pin-dots").classList.add("shake");
        setTimeout(()=>{ pinBuffer=""; renderPinDots(false); document.getElementById("pin-dots").classList.remove("shake"); },800);
      }
    },150);
  }
}

function loginAs(emp){
  currentEmp = emp;
  document.getElementById("login-page").style.display="none";
  document.getElementById("main-app").style.display="block";
  document.getElementById("tb-points").textContent = emp.points;
  refreshAll();
}

function logout(){
  currentEmp=null; pinBuffer=""; selectedEmpId=null;
  document.getElementById("main-app").style.display="none";
  document.getElementById("login-page").style.display="flex";
  document.getElementById("emp-list").style.display="block";
  document.getElementById("pin-panel").style.display="none";
  renderEmpList();
}

// ══════════════════════════════════════════════════════
// NAVIGATION
// ══════════════════════════════════════════════════════
function goTab(tab){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.querySelectorAll(".navbtn").forEach(b=>b.classList.remove("active"));
  document.getElementById("page-"+tab).classList.add("active");
  document.querySelector(`[data-tab="${tab}"]`).classList.add("active");
  if(tab==="shifts") { renderShifts(); renderDaysOff(); }
  if(tab==="tasks")  renderTasks();
  if(tab==="profile") renderProfile();
  if(tab==="events") renderEvents();
  if(tab==="colleagues") renderColleagues();
  if(tab==="trainings") renderTrainings();
}

// ══════════════════════════════════════════════════════
// REFRESH ALL
// ══════════════════════════════════════════════════════
function refreshAll(){
  if(!currentEmp||!appData) return;
  const emp = appData.employees.find(e=>e.id===currentEmp.id)||currentEmp;
  currentEmp = emp;
  document.getElementById("tb-points").textContent = emp.points;
  renderHome(); renderShifts(); renderTasks(); renderProfile(); renderColleagues(); renderTrainings(); updateBadges();
}

// ══════════════════════════════════════════════════════
// HOME
// ══════════════════════════════════════════════════════
function renderHome(){
  const emp = currentEmp;
  document.getElementById("home-mono").textContent = emp.initials;
  document.getElementById("home-name").textContent = emp.name;
  document.getElementById("home-role").textContent = emp.role.toUpperCase();

  const today = fmtDate(new Date());
  const todayShifts = ((appData.shifts||{})[today]||[]).filter(s=>s.empId===emp.id);
  const badge = document.getElementById("home-shift-badge");
  if(todayShifts.length>0){
    badge.innerHTML=`<div class="shift-badge"><span style="color:var(--gold);">◷</span> Dnes ${todayShifts[0].start} – ${todayShifts[0].end}</div>`;
  }else{
    badge.innerHTML=`<div style="color:rgba(245,239,224,0.45);font-size:13px;letter-spacing:2px;">Dnes volno</div>`;
  }

  const myTasks = (appData.tasks||[]).filter(t=>t.empId===emp.id&&!t.done);
  document.getElementById("home-points").textContent = emp.points;
  document.getElementById("home-tasks").textContent = myTasks.length;

  const tList = document.getElementById("home-task-list");
  if(myTasks.length>0){
    const PRI={high:"var(--brick)",medium:"var(--gold)",low:"var(--muted)"};
    tList.innerHTML = myTasks.slice(0,2).map(t=>`
      <div class="task-row" onclick="openTaskDetail(${t.id})">
        <div class="task-bar" style="background:${PRI[t.priority]||"var(--muted)"}"></div>
        <div style="flex:1;">
          <div class="task-title">${t.title}</div>
          <div class="task-desc">${t.desc.slice(0,55)}…</div>
        </div>
        <span style="color:var(--gold);font-size:18px;">›</span>
      </div>`).join("") +
      (myTasks.length>2?`<div onclick="goTab('tasks')" style="text-align:center;color:var(--wine);font-size:12px;letter-spacing:2px;cursor:pointer;padding:6px 0;">+ ${myTasks.length-2} DALŠÍ ÚKOLY</div>`:"");
  }else{
    tList.innerHTML="";
  }

  const nextT = (appData.trainings||[]).filter(function(t){
    const ids=t.empIds||(t.empId==="all"?["all"]:[String(t.empId)]);
    return (ids.includes("all")||ids.includes(String(emp.id)))&&!t.done;
  }).sort(function(a,b){ return a.date.localeCompare(b.date); })[0];
  const trEl = document.getElementById("home-training");
  if(nextT){
    trEl.innerHTML=`<div class="card card-pad" onclick="openTrainingDetail(${nextT.id})" style="display:flex;gap:14px;align-items:center;cursor:pointer;">
      <span style="font-size:22px;color:var(--gold);">◈</span>
      <div style="flex:1;">
        <div class="sec-title" style="margin:0 0 3px;">NAPLÁNOVANÉ ŠKOLENÍ</div>
        <div style="font-family:'Playfair Display',serif;font-weight:600;color:var(--charcoal);">${nextT.title}</div>
        <div style="font-size:12px;color:var(--muted);">${nextT.date}${nextT.article?" · 📄":""}${nextT.fileUrl?" · 📎":""}</div>
      </div>
      <span style="color:var(--gold);font-size:18px;">›</span>
    </div>`;
  }else trEl.innerHTML="";

  // Přehled směn tento týden
  // Potvrzené akce
  var evEl = document.getElementById("home-events");
  var today2 = fmtDate(new Date());
  var confirmedEvents = (appData.events||[]).filter(function(ev){
    if(!(ev.invited||[]).includes(emp.id)) return false;
    var resp = (ev.responses||[]).find(function(r){ return r.empId===emp.id; });
    return resp && resp.status==="yes" && ev.date >= today2;
  }).sort(function(a,b){ return a.date.localeCompare(b.date); });

  if(confirmedEvents.length>0){
    var evHtml = '<div style="margin-top:10px;"><div class="sec-title" style="margin-bottom:8px;">POTVRZENÉ AKCE</div>';
    confirmedEvents.slice(0,3).forEach(function(ev){
      evHtml += '<div onclick="goTab(\'events\')" style="background:#fff;border-radius:8px;padding:12px 14px;margin-bottom:8px;border:1px solid rgba(46,125,50,0.3);display:flex;align-items:center;gap:12px;cursor:pointer;">'
        + '<span style="font-size:20px;">◆</span>'
        + '<div style="flex:1;">'
          + '<div style="font-family:\'Playfair Display\',serif;font-weight:700;font-size:15px;color:var(--charcoal);">'+ev.title+'</div>'
          + '<div style="font-size:12px;color:var(--muted);">📅 '+ev.date+(ev.place?' · 📍 '+ev.place:'')+'</div>'
        + '</div>'
        + '<span style="font-size:12px;color:#2e7d32;font-weight:700;">✓</span>'
      + '</div>';
    });
    evHtml += '</div>';
    evEl.innerHTML = evHtml;
  } else {
    evEl.innerHTML = "";
  }

  const weekEl = document.getElementById("home-week");
  const week = getWeekDates(0);
  const todayStr2 = fmtDate(new Date());
  const DAYS_FULL = ["Ne","Po","Út","St","Čt","Pá","So"];
  var weekShifts = "";
  var hasAnyShift = false;
  for(var wi=0; wi<7; wi++){
    var day = week[wi];
    var key = fmtDate(day);
    var dayShifts = ((appData.shifts||{})[key]||[]).filter(function(s){ return s.empId===emp.id; });
    if(dayShifts.length===0) continue;
    hasAnyShift = true;
    var isToday = key===todayStr2;
    var s = dayShifts[0];
    var dow = day.getDay();
    var isWE = dow===0||dow===6;
    weekShifts += '<div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--creamD);">' +
      '<div style="width:36px;text-align:center;">' +

      '</div>' +
      '<div style="flex:1;">' +
        '<div style="font-size:14px;color:var(--charcoal);font-weight:600;">' + s.start + ' – ' + s.end + '</div>' +

      '<span style="font-size:' + (isToday?'var(--wine)':'var(--gold)') + ';font-size:20px;">◷</span>' +

  if(hasAnyShift){
    weekEl.innerHTML = '<div style="margin-top:10px;"><div class="sec-title" style="margin-bottom:8px;">SMĚNY TENTO TÝDEN</div>' +
      '<div class="card card-pad" style="padding-top:0;padding-bottom:0;" onclick="goTab(\'shifts\')" >' +

function changeWeek(delta){
  weekOffset = delta===0 ? 0 : weekOffset+delta;
  document.getElementById("today-btn").classList.toggle("active", weekOffset===0);
  renderShifts();
}

function renderShifts(){
  if(!currentEmp||!appData) return;
  const week = getWeekDates(weekOffset);
  const getName = id=>(appData.employees||[]).find(e=>e.id===id)?.name.split(" ")[0]||"?";

  document.getElementById("week-range").textContent =
    `${DAYS_CZ[week[0].getDay()]} ${week[0].getDate()}.${week[0].getMonth()+1} — ${DAYS_CZ[week[6].getDay()]} ${week[6].getDate()}.${week[6].getMonth()+1}`;

  const todayStr = fmtDate(new Date());
  const html = week.map(day=>{
    const key=fmtDate(day);
    const all=(appData.shifts||{})[key]||[];
    const isToday=key===todayStr;
    const isWE=day.getDay()===0||day.getDay()===6;
    const isMine=all.some(s=>s.empId===currentEmp.id);

    const hdrClass=isToday?"today":isWE?"weekend":"normal";
    const dayTitle=`${DAYS_CZ[day.getDay()]} ${day.getDate()}. ${MONTHS_CZ[day.getMonth()]}`;

    let rows="";
    if(all.length>0){
      rows=all.map(s=>{
        const me=s.empId===currentEmp.id;
        const[sh,sm]=s.start.split(":").map(Number);
        const[eh,em]=s.end.split(":").map(Number);
        const mins=eh*60+em-sh*60-sm;
        const dur=me?`<span class="shift-dur">${Math.floor(mins/60)}h${mins%60>0?` ${mins%60}m`:""}</span>`:"";
        return `<div class="shift-row${me?" mine":""}">
          <span class="shift-emp">${getName(s.empId)}</span>
          <span class="shift-time">${s.start} – ${s.end}</span>
          ${dur}
        </div>`;
      }).join("");
    }else{
      rows=`<div class="no-shifts">Bez směn</div>`;
    }

    const dayNote=(appData.shiftNotes||{})[key]||"";

    return `<div class="card day-card" style="border:1px solid ${isToday?"var(--gold)":"var(--creamD)"};">
      <div class="day-header ${hdrClass}">
        <span class="day-title">${dayTitle}</span>
        ${isToday?`<span class="today-badge">DNES</span>`:""}
        ${isMine&&!isToday?`<span class="mine-badge">VAŠE SMĚNA</span>`:""}
      </div>
      ${dayNote?`<div style="padding:6px 14px;background:rgba(184,92,56,0.08);border-bottom:1px solid var(--creamD);font-size:12px;color:var(--brick);">📌 ${dayNote}</div>`:""}
      ${rows}
    </div>`;
  }).join("");

  document.getElementById("shifts-list").innerHTML=html;
}

function renderTasks(){
  if(!currentEmp||!appData) return;
  const PRI={high:"#C0392B",medium:"var(--gold)",low:"var(--muted)"};
  const PRIL={high:"Vysoká",medium:"Střední",low:"Nízká"};
  const myTasks=(appData.tasks||[]).filter(t=>t.empId===currentEmp.id);
  const open=myTasks.filter(t=>!t.done), done=myTasks.filter(t=>t.done);

  document.getElementById("tasks-summary").textContent=`${open.length} K DOKONČENÍ · ${done.length} SPLNĚNO`;

  let html=open.map(t=>`
    <div class="task-row" onclick="openTaskDetail(${t.id})" style="box-shadow:0 1px 6px rgba(44,32,24,.05);">

function openTaskDetail(id){
  const t=(appData.tasks||[]).find(t=>t.id===id); if(!t) return;
  currentTaskId=id;
  const PRI={high:"#C0392B",medium:"var(--gold)",low:"var(--muted)"};
  const PRIL={high:"Vysoká",medium:"Střední",low:"Nízká"};
  const el=document.getElementById("task-detail");
  document.getElementById("td-pri").textContent=(PRIL[t.priority]||"Nízká").toUpperCase()+" PRIORITA";
  document.getElementById("td-pri").style.cssText=`background:${PRI[t.priority]||"var(--muted)"}22;color:${PRI[t.priority]||"var(--muted)"};display:inline-block;border-radius:3px;padding:3px 12px;font-size:10px;letter-spacing:3px;margin-bottom:14px;`;
  document.getElementById("td-title").textContent=t.title;
  document.getElementById("td-desc").textContent=t.desc;
  const btn=document.getElementById("td-btn");
  btn.textContent=t.done?"↩  OZNAČIT JAKO NEHOTOVÉ":"✦  SPLNĚNO  (+10 BODŮ)";
  btn.className="complete-btn "+(t.done?"done":"todo");
  el.classList.add("open");
}

function closeTaskDetail(){ document.getElementById("task-detail").classList.remove("open"); }

async function toggleCurrentTask(){
  if(!currentTaskId||!appData) return;
  const tasks=(appData.tasks||[]);
  const t=tasks.find(t=>t.id===currentTaskId); if(!t) return;
  const wasDone=t.done;
  const newTasks=tasks.map(x=>x.id===currentTaskId?{...x,done:!x.done}:x);
  const newEmps=(appData.employees||[]).map(e=>e.id===currentEmp.id?{...e,points:e.points+(wasDone?-10:10)}:e);
  const next={...appData,tasks:newTasks,employees:newEmps};
  appData=next;
  await saveToFirestore(next);
  closeTaskDetail();
  showToast(wasDone?"Úkol označen jako nehotový":"Splněno! +10 bodů ✦");
}

async function saveContact(){

  currentEmp=Object.assign({},currentEmp,{phone,birthday});
  showToast("Kontakt uložen ✦"); renderProfile();
}

async function changePin(){
  const pin=document.getElementById("new-pin-input").value.trim();
  if(!/^\d{4}$/.test(pin)){ showToast("PIN musí mít přesně 4 číslice"); return; }
  const emps=(appData.employees||[]).map(e=>e.id===currentEmp.id?Object.assign({},e,{pin}):e);
  const next=Object.assign({},appData,{employees:emps});
  appData=next; await saveToFirestore(next);
  currentEmp=Object.assign({},currentEmp,{pin});
  showToast("PIN byl změněn ✦");
  document.getElementById("new-pin-input").value="";
}

function uploadPhoto(input){
  const file=input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=function(e){
    const img=new Image();
    img.onload=async function(){
      const canvas=document.createElement("canvas");
      const size=200;
      const ratio=Math.min(size/img.width,size/img.height);
      canvas.width=img.width*ratio; canvas.height=img.height*ratio;
      canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);
      const photo=canvas.toDataURL("image/jpeg",0.8);
      const emps=(appData.employees||[]).map(emp=>emp.id===currentEmp.id?Object.assign({},emp,{photo}):emp);
      const next=Object.assign({},appData,{employees:emps});
      appData=next; await saveToFirestore(next);
      currentEmp=Object.assign({},currentEmp,{photo});
      showToast("Fotka uložena ✦"); renderProfile();
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

async function removePhoto(){
  if(!confirm("Odebrat profilovou fotku?")) return;
  const emps=(appData.employees||[]).map(emp=>emp.id===currentEmp.id?Object.assign({},emp,{photo:""}):emp);
  const next=Object.assign({},appData,{employees:emps});
  appData=next; await saveToFirestore(next);

var daysOffYear=new Date().getFullYear();
var daysOffMonth=new Date().getMonth(); // 0-based

function changeDaysOffMonth(delta){
  if(delta===0){
    daysOffYear=new Date().getFullYear();
    daysOffMonth=new Date().getMonth();
  } else {
    daysOffMonth+=delta;
    if(daysOffMonth>11){ daysOffMonth=0; daysOffYear++; }
    if(daysOffMonth<0){ daysOffMonth=11; daysOffYear--; }
  }
  renderDaysOff();
}

function renderDaysOff(){
  if(!currentEmp||!appData) return;
  const emp=currentEmp;
  const allDaysOff=appData.daysOff||{};
  const myDaysOff=allDaysOff[emp.id]||[];

  const year=daysOffYear;
  const month=daysOffMonth;
  const daysInMonth=new Date(year,month+1,0).getDate();
  const firstDow=new Date(year,month,1).getDay();
  const offset=firstDow===0?6:firstDow-1;
  const MONTHS_CZ2=["Leden","Únor","Březen","Duben","Květen","Červen","Červenec","Srpen","Září","Říjen","Listopad","Prosinec"];
  const DAYS_SHORT=["Po","Út","St","Čt","Pá","So","Ne"];

  var labelEl=document.getElementById("daysoff-month-label");
  if(labelEl) labelEl.textContent=MONTHS_CZ2[month]+" "+year;

  let cal='<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:10px;">';
  DAYS_SHORT.forEach(function(d){
    cal+='<div style="text-align:center;font-size:9px;color:var(--muted);padding:4px 0;font-weight:700;letter-spacing:1px;">'+d+'</div>';
  });
  for(var i=0;i<offset;i++) cal+='<div></div>';
  var today=new Date(); today.setHours(0,0,0,0);
  for(var d=1;d<=daysInMonth;d++){
    var date=year+'-'+String(month+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    var dow=new Date(date).getDay();
    var isWE=dow===0||dow===6;
    var isSel=myDaysOff.includes(date);
    var isPast=new Date(date)<today;
    cal+='<div onclick="'+(isPast?'':'toggleDayOff(\''+date+'\')')+'" style="'+
      'text-align:center;padding:6px 2px;border-radius:4px;font-size:12px;cursor:'+(isPast?'default':'pointer')+';'+
      'background:'+(isSel?'var(--wine)':isWE?'rgba(107,26,42,0.08)':'#fff')+';'+
      'color:'+(isSel?'var(--cream)':isPast?'#ccc':isWE?'var(--wine)':'var(--charcoal)')+';'+
      'border:1px solid '+(isSel?'var(--wine)':'var(--creamD)')+';'+
      '">'+d+'</div>';
  }
  cal+='</div>';
  document.getElementById("daysoff-cal").innerHTML=cal;

  var listEl=document.getElementById("daysoff-list");
  if(myDaysOff.length===0){
    listEl.innerHTML='<div style="color:var(--muted);font-size:13px;font-style:italic;">Žádné žádosti o volno</div>';
  } else {
    listEl.innerHTML='<div style="font-size:11px;letter-spacing:2px;color:var(--muted);margin-bottom:6px;">OZNAČENÉ DNY:</div>'+
      myDaysOff.sort().map(function(d){
        return '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--creamD);">'+
          '<span style="font-size:14px;color:var(--charcoal);">'+d+'</span>'+
          '<button onclick="toggleDayOff(\''+d+'\')" style="background:none;border:1px solid var(--creamD);border-radius:4px;padding:3px 8px;color:var(--muted);cursor:pointer;font-size:12px;">✕</button>'+
          '</div>';
      }).join('');
  }
}

async function toggleDayOff(date){
  if(!currentEmp||!appData) return;
  const empId=currentEmp.id;
  const allDaysOff=Object.assign({},appData.daysOff||{});
  const myDays=allDaysOff[empId]||[];
  if(myDays.includes(date)){
    allDaysOff[empId]=myDays.filter(function(d){ return d!==date; });
  } else {
    allDaysOff[empId]=[...myDays,date];
  }
  const next=Object.assign({},appData,{daysOff:allDaysOff});
  appData=next;
  await saveToFirestore(next);
  renderDaysOff();
}

async function respondEvent(evId, status){
  if(!currentEmp||!appData) return;
  var empId=currentEmp.id;
  var events=(appData.events||[]).map(function(ev){
    if(ev.id!==evId) return ev;
    var responses=(ev.responses||[]).filter(function(r){ return r.empId!==empId; });
    responses.push({empId:empId, status:status});
    var copy={};
    for(var k in ev) copy[k]=ev[k];
    copy.responses=responses;
    return copy;
  });
  var next={};
  for(var k in appData) next[k]=appData[k];
  next.events=events;
  appData=next;
  await saveToFirestore(next);
  showToast(status==="yes"?"Účast potvrzena ✦":"Odmítnuto");
  renderEvents();
  renderHome(); // Refresh úvodu
  updateBadges();
}

  var weekShifts="";
  var DAYS=["Ne","Po","Út","St","Čt","Pá","So"];
  for(var wi=0;wi<7;wi++){
    var day=new Date(today);
    var dow=today.getDay();
    var mondayOff=dow===0?-6:1-dow;
    day=new Date(today);
    day.setDate(today.getDate()+mondayOff+wi);
    var key=day.getFullYear()+'-'+String(day.getMonth()+1).padStart(2,'0')+'-'+String(day.getDate()).padStart(2,'0');
    var ds=((appData.shifts||{})[key]||[]).filter(function(s){ return s.empId===e.id; });
    if(ds.length===0) continue;
    var isToday=key===todayStr;
    weekShifts+='<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--creamD);">'
      +'<div style="width:32px;text-align:center;">'
        +'<div style="font-size:9px;color:var(--muted);">'+DAYS[day.getDay()]+'</div>'
        +'<div style="font-size:16px;font-weight:700;color:'+(isToday?'var(--wine)':'var(--charcoal)')+';">'+day.getDate()+'</div>'
      +'</div>'
      +'<div style="font-size:14px;color:var(--charcoal);">'+ds[0].start+' – '+ds[0].end+'</div>'
      +(isToday?'<span style="font-size:10px;color:var(--wine);letter-spacing:1px;">DNES</span>':'')
    +'</div>';
  }

  var html='<button onclick="document.getElementById(\'colleague-detail\').style.display=\'none\'" style="background:none;border:1px solid var(--creamD);border-radius:4px;padding:7px 16px;cursor:pointer;color:var(--wine);font-size:13px;letter-spacing:2px;margin-bottom:20px;font-family:\'Cormorant Garamond\',serif;">‹ ZPĚT</button>'
  +'<div style="display:flex;align-items:center;gap:16px;margin-bottom:20px;">'
    +photoHtml
    +'<div>'
      +'<div style="font-family:\'Playfair Display\',serif;font-size:22px;font-weight:700;color:var(--charcoal);">'+e.name+(isMe?' <span style="font-size:12px;color:var(--gold);">(JÁ)</span>':'')+'</div>'
      +'<div style="font-size:11px;color:var(--muted);letter-spacing:2px;margin-bottom:4px;">'+(e.role||e.type||"").toUpperCase()+'</div>'
      +(e.phone?'<a href="tel:'+e.phone+'" style="font-size:14px;color:var(--wine);text-decoration:none;display:block;">📞 '+e.phone+'</a>':'')
      +(e.birthday?'<div style="font-size:13px;color:var(--muted);">🎂 '+e.birthday+'</div>':'')
    +'</div>'
  +'</div>'
  // Body
  +'<div class="card card-pad" style="border:1px solid rgba(201,168,76,0.44);display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">'
    +'<div><div style="font-size:10px;letter-spacing:3px;color:var(--muted);">BODY</div><div style="font-size:12px;color:var(--muted);">Celkové skóre</div></div>'
    +'<div style="font-family:\'Playfair Display\',serif;font-size:28px;font-weight:700;color:var(--wine);">'+(e.points||0)+' ✦</div>'
  +'</div>';

  // Ocenění
  if(awards.length>0){
    html+='<div class="card card-pad" style="margin-bottom:10px;">'
      +'<div style="font-size:10px;letter-spacing:3px;color:var(--muted);margin-bottom:10px;">OCENĚNÍ</div>'
      +awards.map(function(a){ return '<div style="display:flex;align-items:center;gap:8px;font-size:14px;color:var(--charcoal);margin-bottom:6px;"><span style="color:var(--gold);">✦</span>'+a.title+'</div>'; }).join("")
    +'</div>';
  }

  // Úkoly
  if(tasks.length>0){
    html+='<div class="card card-pad" style="margin-bottom:10px;">'
      +'<div style="display:flex;justify-content:space-between;margin-bottom:8px;">'
        +'<div style="font-size:10px;letter-spacing:3px;color:var(--muted);">PLNĚNÍ ÚKOLŮ</div>'
        +'<div style="font-size:13px;color:var(--wine);font-weight:700;">'+pct+'%</div>'
      +'</div>'
      +'<div style="background:var(--creamD);border-radius:3px;height:6px;margin-bottom:10px;"><div style="background:var(--wine);height:6px;border-radius:3px;width:'+pct+'%;"></div></div>'
      +(openTasks.length>0?'<div style="font-size:10px;letter-spacing:2px;color:var(--muted);margin-bottom:6px;">OTEVŘENÉ</div>'+openTasks.map(function(t){ return '<div style="font-size:13px;color:var(--charcoal);padding:4px 0;border-bottom:1px solid var(--creamD);">◈ '+t.title+'</div>'; }).join(""):'')
      +(doneTasks.length>0?'<div style="font-size:10px;letter-spacing:2px;color:var(--muted);margin:8px 0 6px;">SPLNĚNÉ</div>'+doneTasks.map(function(t){ return '<div style="font-size:13px;color:var(--muted);padding:4px 0;text-decoration:line-through;">✓ '+t.title+'</div>'; }).join(""):'')
    +'</div>';
  }

  // Naplánovaná školení
  if(upcoming.length>0){
    html+='<div class="card card-pad" style="margin-bottom:10px;">'
      +'<div style="font-size:10px;letter-spacing:3px;color:var(--muted);margin-bottom:10px;">NAPLÁNOVANÁ ŠKOLENÍ</div>'
      +upcoming.map(function(t){ return '<div onclick="openTrainingDetail('+t.id+')" style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--creamD);cursor:pointer;"><span style="font-size:14px;color:var(--charcoal);">◈ '+t.title+'</span><span style="font-size:11px;color:var(--muted);">'+t.date+' ›</span></div>'; }).join("")
    +'</div>';
  }

  // Absolvovaná školení
  if(attended.length>0){
    html+='<div class="card card-pad" style="margin-bottom:10px;">'
      +'<div style="font-size:10px;letter-spacing:3px;color:var(--muted);margin-bottom:10px;">ABSOLVOVANÁ ŠKOLENÍ</div>'
      +attended.map(function(t){ return '<div onclick="openTrainingDetail('+t.id+')" style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--creamD);cursor:pointer;"><span style="font-size:14px;color:var(--charcoal);">✦ '+t.title+'</span><span style="font-size:11px;color:var(--gold);">'+t.date+' ›</span></div>'; }).join("")
    +'</div>';
  }

  // Potvrzené akce
  var today3 = new Date();
  var todayStr3 = today3.getFullYear()+'-'+String(today3.getMonth()+1).padStart(2,'0')+'-'+String(today3.getDate()).padStart(2,'0');
  var confirmedEvs = (appData.events||[]).filter(function(ev){
    if(!(ev.invited||[]).includes(e.id)) return false;
    var resp=(ev.responses||[]).find(function(r){ return r.empId===e.id; });
    return resp&&resp.status==="yes";
  }).sort(function(a,b){ return b.date.localeCompare(a.date); });
  var declinedEvs = (appData.events||[]).filter(function(ev){
    if(!(ev.invited||[]).includes(e.id)) return false;
    var resp=(ev.responses||[]).find(function(r){ return r.empId===e.id; });
    return resp&&resp.status==="no";
  });

  if(confirmedEvs.length>0||declinedEvs.length>0){
    html+='<div class="card card-pad" style="margin-bottom:10px;">'
      +'<div style="font-size:10px;letter-spacing:3px;color:var(--muted);margin-bottom:10px;">AKCE</div>'
      +confirmedEvs.map(function(ev){ return '<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--creamD);"><span style="font-size:14px;color:var(--charcoal);">◆ '+ev.title+'</span><span style="font-size:11px;color:#2e7d32;font-weight:700;">✓ Potvrzeno</span></div>'; }).join("")
      +declinedEvs.map(function(ev){ return '<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--creamD);"><span style="font-size:14px;color:var(--muted);">◆ '+ev.title+'</span><span style="font-size:11px;color:var(--brick);font-weight:700;">✕ Nemohu</span></div>'; }).join("")
    +'</div>';
  }

  overlay.innerHTML=html;
  overlay.style.display="block";
  overlay.scrollTop=0;
}

function updateBadges(){
  if(!currentEmp||!appData) return;
  var empId=currentEmp.id;
  // Úkoly — nesplněné
  var openTasks=(appData.tasks||[]).filter(function(t){ return t.empId===empId&&!t.done; }).length;
  var bt=document.getElementById("badge-tasks");
  if(bt){ if(openTasks>0){ bt.textContent=openTasks>9?"9+":openTasks; bt.style.display="flex"; } else bt.style.display="none"; }
  // Akce — čekající pozvánky
  var pendingEvents=(appData.events||[]).filter(function(ev){
    if(!(ev.invited||[]).includes(empId)) return false;
    var resp=(ev.responses||[]).find(function(r){ return r.empId===empId; });
    return !resp||resp.status==="pending";
  }).length;
  var be=document.getElementById("badge-events");
  if(be){ if(pendingEvents>0){ be.textContent=pendingEvents>9?"9+":pendingEvents; be.style.display="flex"; } else be.style.display="none"; }
}

function showToast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.style.display="block";
  setTimeout(()=>{ t.style.display="none"; },2200);
}
