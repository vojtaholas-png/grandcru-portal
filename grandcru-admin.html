<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#FAF6EE;font-family:'Cormorant Garamond',serif;min-height:100vh;}
:root{
  --wine:#6B1A2A;--wineD:#4A0E1C;--wineL:#8B2A3F;
  --gold:#C9A84C;--goldL:#E8C96B;
  --cream:#F5EFE0;--creamD:#EDE3CC;--warm:#FAF6EE;
  --charcoal:#2C2018;--muted:#8C7B6B;--brick:#B85C38;--bg:#1A0F0A;
}
button{cursor:pointer;font-family:'Cormorant Garamond',serif;}
input,select,textarea{font-family:'Cormorant Garamond',serif;outline:none;}

/* ── LOADING ── */
#loading{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;}
.spinner{width:32px;height:32px;border:2px solid rgba(201,168,76,.2);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin-top:24px;}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── LOGIN ── */
#login-page{min-height:100vh;background:linear-gradient(170deg,var(--bg),var(--wine) 60%,#3D0F1C);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;}
.pin-dots{display:flex;justify-content:center;gap:16px;margin-bottom:32px;}
.pin-dot{width:14px;height:14px;border-radius:50%;background:transparent;border:2px solid var(--gold);transition:all .15s;}
.pin-dot.filled{background:var(--gold);}
.pin-dot.error{background:#e53935;border-color:#e53935;}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:260px;width:100%;}
.num-btn{background:rgba(245,239,224,.08);border:1px solid rgba(201,168,76,.2);border-radius:4px;padding:14px 0;color:var(--cream);font-size:20px;font-weight:600;font-family:'Playfair Display',serif;}
.num-btn.empty{background:transparent;border:none;}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.shake{animation:shake .4s;}

/* ── TOPBAR ── */
#topbar{background:linear-gradient(90deg,var(--wineD),var(--wine));padding:12px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(201,168,76,.3);position:sticky;top:0;z-index:100;}

/* ── TAB NAV ── */
#tabnav{background:#fff;border-bottom:1px solid var(--creamD);display:flex;overflow-x:auto;position:sticky;top:52px;z-index:99;scrollbar-width:none;}
#tabnav::-webkit-scrollbar{display:none;}
.tabn{background:none;border:none;border-bottom:2px solid transparent;padding:12px 16px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:80px;color:var(--muted);flex-shrink:0;transition:color .2s;}
.tabn.active{border-bottom-color:var(--wine);color:var(--wine);}
.tabn-ic{font-size:16px;}
.tabn-lbl{font-size:10px;letter-spacing:1px;font-weight:400;}
.tabn.active .tabn-lbl{font-weight:700;}

/* ── CONTENT ── */
#content{max-width:700px;margin:0 auto;padding:20px 20px 40px;}
.tab-panel{display:none;}
.tab-panel.active{display:block;}

/* ── SECTION TITLE ── */
.sec-title{font-size:10px;letter-spacing:4px;color:var(--muted);margin:0 0 12px;}

/* ── CARD ── */
.card{background:#fff;border-radius:6px;border:1px solid var(--creamD);margin-bottom:10px;padding:16px 18px;}

/* ── BUTTONS ── */
.btn{border:none;border-radius:4px;font-size:13px;font-weight:700;letter-spacing:1px;padding:10px 20px;font-family:'Cormorant Garamond',serif;}
.btn-primary{background:linear-gradient(135deg,var(--wine),var(--wineD));color:var(--cream);}
.btn-secondary{background:#fff;border:1px solid var(--creamD);color:var(--wine);}
.btn-danger{background:var(--brick);color:var(--cream);}
.btn-sm{padding:6px 14px;font-size:11px;letter-spacing:2px;}
.btn-gold{background:linear-gradient(135deg,#b8921e,var(--gold));color:#fff;}

/* ── FORM FIELDS ── */
.field{margin-bottom:12px;}
.field label{display:block;font-size:10px;letter-spacing:3px;color:var(--muted);margin-bottom:5px;}
.field input,.field select,.field textarea{width:100%;background:#fff;border:1px solid var(--creamD);border-radius:4px;padding:10px 12px;font-size:14px;color:var(--charcoal);}
.field textarea{resize:vertical;}

/* ── MONO ── */
.mono{border-radius:50%;background:linear-gradient(135deg,var(--wine),var(--wineD));border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;color:var(--goldL);font-family:'Playfair Display',serif;font-weight:700;letter-spacing:2px;flex-shrink:0;}

/* ── MODAL ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:999;padding:20px;display:none;}
.modal-bg.open{display:flex;}
.modal-box{background:var(--warm);border-radius:8px;padding:24px;width:100%;max-width:420px;max-height:85vh;overflow-y:auto;border:1px solid var(--creamD);}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.modal-title{font-family:'Playfair Display',serif;font-size:18px;font-weight:700;color:var(--charcoal);}
.modal-close{background:none;border:none;font-size:20px;color:var(--muted);}

/* ── TOAST ── */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--wine);color:var(--cream);padding:10px 20px;border-radius:6px;font-size:13px;letter-spacing:1px;z-index:9999;display:none;white-space:nowrap;}

/* ── SHIFT CALENDAR ── */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:12px;}
.cal-head{text-align:center;font-size:9px;color:var(--muted);padding:4px 0;font-weight:700;letter-spacing:1px;}
.cal-cell{background:#fff;border:1px solid var(--creamD);border-radius:4px;padding:4px 3px;min-height:44px;font-size:10px;}
.cal-cell.sun{background:rgba(107,26,42,.04);}
.cal-cell.sat{background:rgba(107,26,42,.02);}
.cal-cell.no-shift{background:var(--creamD);opacity:.5;}
.cal-cell .cal-day{font-weight:700;color:var(--charcoal);margin-bottom:2px;}
.cal-cell.sun .cal-day,.cal-cell.empty .cal-day{color:var(--muted);}
.shift-chip{background:var(--wine);color:var(--cream);border-radius:2px;padding:1px 3px;font-size:8px;margin-bottom:1px;display:block;}
.dayoff-cell{cursor:pointer;user-select:none;}
.dayoff-cell.selected{background:var(--wine)!important;border-color:var(--wine);}
.dayoff-cell.selected .cal-day{color:var(--cream)!important;}

/* ── PROGRESS BAR ── */
.prog-bg{background:var(--creamD);border-radius:10px;height:6px;overflow:hidden;}
.prog-fill{height:100%;border-radius:10px;background:linear-gradient(90deg,var(--wine),var(--gold));transition:width .6s;}
</style>
</head>

async function saveData(data){
  try{ await db.collection("grandcru").doc("data").set(data); }
  catch(e){ showToast("Chyba uložení: "+e.message); }
}

window.addEventListener("load", async ()=>{
  const now=new Date(); genYear=now.getFullYear(); genMonth=now.getMonth()+1;
  try{
    const snap = await db.collection("grandcru").doc("data").get();
    if(snap.exists){ appData=snap.data(); }
    else{ appData={...SEED}; await saveData(appData); }
  }catch(e){
    // Firebase not configured yet — use seed for demo
    appData={...SEED};
  }
  // Live listener
  db.collection("grandcru").doc("data").onSnapshot(snap=>{ if(snap.exists){ appData=snap.data(); if(currentTab) renderTab(currentTab); }});
  document.getElementById("loading").style.display="none";
  document.getElementById("login-page").style.display="flex";
  renderPinDots(false);
});

let adminPin="";
function renderPinDots(err){
  document.getElementById("pin-dots").innerHTML=[0,1,2,3].map(i=>`<div class="pin-dot${err?" error":adminPin.length>i?" filled":""}"></div>`).join("");
}
function pressPin(d){
  if(d==="back"){ adminPin=adminPin.slice(0,-1); renderPinDots(false); return; }
  if(adminPin.length>=4) return;
  adminPin+=d; renderPinDots(false);
  if(adminPin.length===4) setTimeout(()=>{
    if(_adminPinLoaded === null){
      // PIN ještě nenačten - zkus znovu
      db.collection('config').doc('admin').get().then(d => {
        _adminPinLoaded = (d.exists && d.data().pin) ? d.data().pin : null;
      });
      adminPin=""; renderPinDots(false);
      return;
    }
    const correct = _adminPinLoaded;
    if(adminPin===correct){ showAdmin(); }
    else{
      renderPinDots(true);
      document.getElementById("pin-dots").classList.add("shake");
      setTimeout(()=>{ adminPin=""; renderPinDots(false); document.getElementById("pin-dots").classList.remove("shake"); },800);
    }
  },150);
}
function showAdmin(){
  document.getElementById("login-page").style.display="none";
  document.getElementById("main-app").style.display="block";
  goTab("overview");
}
function logout(){
  adminPin="";
  document.getElementById("main-app").style.display="none";
  document.getElementById("login-page").style.display="flex";
  renderPinDots(false);
}

function goTab(tab){

}

  reader.readAsDataURL(file);

async function saveEmp(id){
  const name=document.getElementById("ef-name").value.trim();
  const role=document.getElementById("ef-role").value.trim();
  const pin=document.getElementById("ef-pin").value.trim();
  const initials=document.getElementById("ef-ini").value.trim();
  if(!name||!initials){ showToast("Vyplňte alespoň jméno a iniciály"); return; }
  const emp={
    name,role,pin,initials,
    points:Number(document.getElementById("ef-pts").value)||0,
    absences:Number(document.getElementById("ef-abs").value)||0,
    birthday:document.getElementById("ef-bday").value||"",
    phone:document.getElementById("ef-phone").value.trim()||"",
    photo:document.getElementById("ef-photo").value.trim()||"",
    type:document.getElementById("ef-type").value||"junior",
  };
  let emps=[...(appData.employees||[])];
  if(id){ emps=emps.map(e=>e.id===id?{...emp,id}:e); }
  else{ emp.id=nextId(emps); emps.push(emp); }
  const next={...appData,employees:emps};
  appData=next; await saveData(next); closeModal("modal-emp"); showToast("Uloženo ✦"); renderEmployees();
}

async function deleteEmp(id){
  if(!confirm("Opravdu smazat?")) return;
  const next={...appData,employees:(appData.employees||[]).filter(e=>e.id!==id),tasks:(appData.tasks||[]).filter(t=>t.empId!==id),trainings:(appData.trainings||[]).filter(t=>t.empId!==id)};
  appData=next; await saveData(next); showToast("Smazáno"); renderEmployees();
}

async function resetPin(id, name){
  if(!confirm(`Resetovat PIN pro ${name}?\nZaměstnanec si bude muset nastavit nový PIN sám v portálu.`)) return;
  const emps=(appData.employees||[]).map(e=>e.id===id?{...e,pin:""}:e);
  const next={...appData,employees:emps};
  appData=next; await saveData(next); showToast(`PIN pro ${name} byl resetován 🔑`); renderEmployees();
}

async function adjustPoints(id,delta){
  const next={...appData,employees:(appData.employees||[]).map(e=>e.id===id?{...e,points:e.points+delta}:e)};
  appData=next; await saveData(next); renderEmployees();
}
async function adjustAbsence(id,delta){
  const next={...appData,employees:(appData.employees||[]).map(e=>e.id===id?{...e,absences:Math.max(0,e.absences+delta)}:e)};
  appData=next; await saveData(next); renderEmployees();
}

async function saveTask(id){
  const title=document.getElementById("tf-title").value.trim();
  if(!title){ showToast("Zadejte název úkolu"); return; }
  const t={empId:Number(document.getElementById("tf-emp").value),title,desc:document.getElementById("tf-desc").value,priority:document.getElementById("tf-pri").value,done:id?(appData.tasks||[]).find(x=>x.id===id)?.done||false:false};

  if(id){ tasks=tasks.map(x=>x.id===id?{...t,id}:x); }
  else{ t.id=nextId(tasks); tasks.push(t); }
  const next={...appData,tasks};
  appData=next; await saveData(next); closeModal("modal-task"); showToast("Uloženo ✦"); renderTasks();

async function toggleTask(id){
  const tasks=(appData.tasks||[]).map(t=>t.id===id?{...t,done:!t.done}:t);
  const next={...appData,tasks};
  appData=next; await saveData(next); renderTasks();
}

async function deleteTask(id){
  if(!confirm("Smazat úkol?")) return;
  const next={...appData,tasks:(appData.tasks||[]).filter(t=>t.id!==id)};
  appData=next; await saveData(next); showToast("Smazáno"); renderTasks();
}

function toggleAllTrainingEmps(cb){
  const all=document.querySelectorAll(".trf-emp-cb");
  if(cb.checked){

    all.forEach(c=>c.checked=false);
  } else {
    // Odškrtl "Všichni" → nechej prázdné, může vybrat jednotlivce
    all.forEach(c=>c.checked=false);
  }
}

function loadTrainingFile(input){
  const file=input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{ document.getElementById("trf-fileurl").value=e.target.result; };
  reader.readAsDataURL(file);
}

async function saveTraining(id){
  const title=document.getElementById("trf-title").value.trim();
  const date=document.getElementById("trf-date").value;
  if(!title||!date){ showToast("Vyplňte název a datum"); return; }

  // Zjisti vybrané checkboxy
  const allCb=document.getElementById("trf-emp-all");
  let empIds;
  if(allCb?.checked){
    empIds=["all"];
  } else {
    const checked=[...document.querySelectorAll(".trf-emp-cb:checked")].map(c=>c.value);
    if(checked.length===0){ showToast("Vyberte alespoň jednoho zaměstnance"); return; }
    empIds=checked;
  }

  const t={
    empIds,
    empId: empIds.length===1&&empIds[0]!=="all"?Number(empIds[0]):(empIds[0]==="all"?"all":empIds[0]), // zpětná kompatibilita
    title, date,
    article: document.getElementById("trf-article").value.trim(),
    fileUrl: document.getElementById("trf-fileurl").value.trim(),
    done: id?(appData.trainings||[]).find(x=>x.id===id)?.done||false:false
  };
  let tr=[...(appData.trainings||[])];
  if(id){ tr=tr.map(x=>x.id===id?{...t,id}:x); }
  else{ t.id=nextId(tr); tr.push(t); }
  const next={...appData,trainings:tr};
  appData=next; await saveData(next); closeModal("modal-training"); showToast("Uloženo ✦"); renderTrainings();
}

async function toggleTraining(id){
  const next={...appData,trainings:(appData.trainings||[]).map(t=>t.id===id?{...t,done:!t.done}:t)};
  appData=next; await saveData(next); renderTrainings();
}
async function deleteTraining(id){
  if(!confirm("Smazat školení?")) return;
  const next={...appData,trainings:(appData.trainings||[]).filter(t=>t.id!==id)};
  appData=next; await saveData(next); showToast("Smazáno"); renderTrainings();
}

function openAttendance(id){
  const t=(appData.trainings||[]).find(x=>x.id===id); if(!t) return;
  const emps=appData.employees||[];

  const ids=t.empIds||(t.empId==="all"?["all"]:[String(t.empId)]);
  const assigned = ids.includes("all")
    ? emps
    : emps.filter(e=>ids.includes(String(e.id)));

  // Kdo už byl označen jako přítomen
  const attended=t.attended||[];

  document.getElementById("modal-attend-box").innerHTML=`
  <div class="modal-header">
    <div class="modal-title">Docházka — ${t.title}</div>
    <button class="modal-close" onclick="closeModal('modal-attend')">✕</button>
  </div>
  <div style="font-size:12px;color:var(--muted);margin-bottom:14px;">📅 ${t.date} · Zaškrtni kdo skutečně byl</div>
  <div style="margin-bottom:16px;">
    ${assigned.map(e=>{
      const wasHere=attended.includes(e.id);
      return `<label style="display:flex;align-items:center;gap:10px;padding:10px;background:${wasHere?"rgba(201,168,76,0.1)":"#fafafa"};border:1px solid ${wasHere?"var(--gold)":"var(--creamD)"};border-radius:6px;margin-bottom:6px;cursor:pointer;">
        <input type="checkbox" class="attend-cb" value="${e.id}" ${wasHere?"checked":""}/>
        ${e.photo?`<img src="${e.photo}" style="width:32px;height:32px;border-radius:50%;object-fit:cover;"/>`:`<div class="mono" style="width:32px;height:32px;font-size:10px;">${e.initials}</div>`}
        <div style="flex:1;">
          <div style="font-family:'Playfair Display',serif;font-weight:700;font-size:14px;color:var(--charcoal);">${e.name}</div>
          <div style="font-size:11px;color:var(--muted);">${e.role||""}</div>
        </div>
        ${wasHere?`<span style="color:var(--gold);font-size:14px;">✦ byl/a</span>`:""}
      </label>`;
    }).join("")}
  </div>
  <div style="font-size:12px;color:var(--muted);margin-bottom:12px;">
    💡 Za každou docházku zaměstnanec dostane <strong>+20 bodů</strong>
  </div>
  <div style="display:flex;gap:10px;">
    <button class="btn btn-primary" onclick="saveAttendance(${id})">ULOŽIT DOCHÁZKU</button>
    <button class="btn btn-secondary" onclick="closeModal('modal-attend')">ZRUŠIT</button>
  </div>`;
  openModal("modal-attend");
}

async function saveAttendance(id){
  const t=(appData.trainings||[]).find(x=>x.id===id); if(!t) return;
  const oldAttended=t.attended||[];
  const newAttended=[...document.querySelectorAll(".attend-cb:checked")].map(c=>Number(c.value));

  // Přidej body těm co nově přišli (nebyli v oldAttended)
  const newlyAttended=newAttended.filter(empId=>!oldAttended.includes(empId));
  const removedAttended=oldAttended.filter(empId=>!newAttended.includes(empId));

  let emps=[...(appData.employees||[])];
  // +20 bodů novým
  newlyAttended.forEach(empId=>{
    emps=emps.map(e=>e.id===empId?{...e,points:(e.points||0)+20}:e);
  });
  // -20 bodů odebraným (odznačeným)
  removedAttended.forEach(empId=>{
    emps=emps.map(e=>e.id===empId?{...e,points:Math.max(0,(e.points||0)-20)}:e);
  });

  const trainings=(appData.trainings||[]).map(x=>x.id===id?{...x,attended:newAttended,done:newAttended.length>0}:x);
  const next={...appData,employees:emps,trainings};
  appData=next; await saveData(next);
  closeModal("modal-attend");
  showToast(`Docházka uložena · +20 bodů pro ${newlyAttended.length} zaměstnanců ✦`);
  renderTrainings();
}

// ══════════════════════════════════════════════════════
// SHIFT GENERATOR — Grand Cru pravidla
// ══════════════════════════════════════════════════════
function generateMonthShifts(employees, year, month, cfg, daysOff, history){
  const shifts={};
  const daysInMonth=new Date(year,month,0).getDate();
  const monthKey=`${year}-${String(month).padStart(2,"0")}`;

  // Rozdělení zaměstnanců podle typu
  const seniors   =employees.filter(e=>e.type==="senior");
  const vedouci   =employees.filter(e=>e.type==="vedouci"); // Libor — jen ručně večerní
  const juniors   =employees.filter(e=>e.type==="junior");
  const brigadnici=employees.filter(e=>e.type==="brigadnik");
  const studenti  =employees.filter(e=>e.type==="student");
  const allActive =employees.filter(e=>["senior","vedouci","junior","brigadnik","student"].includes(e.type||"junior"));

  // Jana Pavlíčková ID — nesmí být s Liborem
  const liborEmp = vedouci[0]||null;
  const janaEmp = employees.find(e=>e.name.includes("Jana")&&e.name.includes("Pavl"))||null;

  // Historie víkendů pro rotaci
  const weHistory=(history||{})[monthKey]||{};
  const weCount={};
  allActive.forEach(e=>weCount[e.id]=weHistory[e.id]||0);

  // Senioři — rotace kdo je na celý den (ranní + večer)
  const seniorFullDayCount={};
  seniors.forEach(e=>seniorFullDayCount[e.id]=0);

  const shuffle=arr=>[...arr].sort(()=>Math.random()-.5);

  // Dostupní zaměstnanci daný den (bez těch co mají volno)
  const avail=(pool,date)=>pool.filter(e=>!((daysOff[e.id]||[]).includes(date)));

  for(let day=1;day<=daysInMonth;day++){
    const date=`${year}-${String(month).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
    const dow=new Date(date).getDay(); // 0=Ne,5=Pá,6=So
    const isFri=dow===5;
    const isSat=dow===6;
    const isSun=dow===0;
    const isWeekend=isSat||isSun;
    const isEventDay=(cfg.eventDays||[]).includes(date);
    const evType=(cfg.eventTypes||{})[date]||"none";
    const isEventLunch=isEventDay&&(evType==="lunch"||evType==="both");
    const isEventEvening=isEventDay&&(evType==="evening"||evType==="both");
    const isSpecial=isFri||isSat||isEventEvening;

    const dayShifts=[];

    // ── 1. SENIOR — jeden záznam celý den ───────────────
    const availSeniors=avail(seniors,date);
    let seniorOfDay=null;
    if(availSeniors.length>0){
      const sorted=[...availSeniors].sort((a,b)=>(seniorFullDayCount[a.id]||0)-(seniorFullDayCount[b.id]||0));
      seniorOfDay=sorted[0];
      seniorFullDayCount[seniorOfDay.id]=(seniorFullDayCount[seniorOfDay.id]||0)+1;
      // Celý den = od ranního do konce večerní (jeden čip)
      dayShifts.push({empId:seniorOfDay.id, start:cfg.morningStart, end:cfg.eveningEnd});
    }

    // ── 2. RANNÍ SMĚNA — 1 junior každý den (Po-Ne) ─────
    let lunchJuniorId = null;
    {
      const availJ = avail(juniors, date);
      const lunchJunior = shuffle(availJ)[0];
      if(lunchJunior){
        lunchJuniorId = lunchJunior.id;
        dayShifts.push({empId:lunchJunior.id, start:cfg.morningStart, end:cfg.morningEnd});
      }
    }
    // Extra lidi na obědy pro speciální dny
    if(isEventLunch && (cfg.eventLunchExtra||{})[date]){
      const extraCount = Number((cfg.eventLunchExtra||{})[date])||0;
      const availExtra = avail(juniors, date).filter(e=>e.id!==lunchJuniorId);
      shuffle(availExtra).slice(0,extraCount).forEach(e=>{
        dayShifts.push({empId:e.id, start:cfg.morningStart, end:cfg.morningEnd});
      });
    }

    // ── 3. VEČERNÍ SMĚNA ─────────────────────────────────
    // Pravidla (CELKOVÝ počet lidí = senior + ranní junior + večerní):
    // Po–Čt: 5 celkem = senior(1) + ranní(1) + večerní(3)
    // Pátek: 6 celkem = senior(1) + ranní(1) + večerní(4)
    // Sobota: 6 celkem = senior(1) + ranní(1) + večerní(4)
    // Neděle: 5 celkem = senior(1) + ranní(1) + večerní(3), student se počítá do večerních
    // Akce: eventCount celkem
    let totalTarget;
    if(isEventEvening) totalTarget = Number(cfg.eventCount)  || 7;
    else if(isFri)  totalTarget = Number(cfg.specialCount)|| 6;
    else if(isSat)  totalTarget = Number(cfg.specialCount)|| 6;
    else if(isSun)  totalTarget = Number(cfg.sundayCount) || 5;
    else            totalTarget = Number(cfg.eveningCount)|| 5;

    // Kolik večerních = total - senior - ranní junior
    const alreadyIn = (seniorOfDay?1:0) + (lunchJuniorId?1:0);
    const needEvening = Math.max(0, totalTarget - alreadyIn);

    if(needEvening > 0){
      // Libor na ručně označené dny — nahradí jednoho juniora
      const liborThisDay = liborEmp && (cfg.liborDays||[]).includes(date);
      // Pokud je Libor → Jana nesmí být
      const excludeJana = liborThisDay && janaEmp ? janaEmp.id : null;

      const eveningPool = avail([...juniors,...brigadnici], date)
        .filter(e => e.id !== lunchJuniorId && e.id !== seniorOfDay?.id && e.id !== excludeJana);
      const sortedPool = [...eveningPool].sort((a,b) => (weCount[a.id]||0) - (weCount[b.id]||0));

      let brigCount = 0;
      let added = 0;
      // Nejdřív přidej Libora pokud je jeho den (místo jednoho juniora)
      if(liborThisDay){
        dayShifts.push({empId:liborEmp.id, start:cfg.eveningStart, end:cfg.eveningEnd});
        weCount[liborEmp.id] = (weCount[liborEmp.id]||0) + 1;
        added++;
      }
      for(const e of sortedPool){
        if(added >= needEvening) break;
        if(e.type === "brigadnik"){
          if(brigCount >= 1) continue;
          brigCount++;
        }
        dayShifts.push({empId:e.id, start:cfg.eveningStart, end:cfg.eveningEnd});
        weCount[e.id] = (weCount[e.id]||0) + 1;
        added++;
      }
    }
    // Student na manuálně označené dny — počítá se DO targetu (ne navíc)
    // Pokud je studentský den, snižíme počet večerních o 1 a přidáme studenta místo toho
    if((cfg.studentDays||[]).includes(date)){
      const student=(employees||[]).find(e=>e.type==="student");
      if(student && !dayShifts.some(s=>s.empId===student.id)){
        // Odeber posledního přidaného večerního (nejméně prioritního)
        const lastEveningIdx = [...dayShifts].map((s,i)=>({s,i}))
          .filter(x=>x.s.start===cfg.eveningStart && x.s.empId!==seniorOfDay?.id)
          .pop()?.i;
        if(lastEveningIdx !== undefined){
          // Odeber ho z weCount
          const removedId = dayShifts[lastEveningIdx].empId;
          weCount[removedId] = Math.max(0,(weCount[removedId]||1)-1);
          dayShifts.splice(lastEveningIdx, 1);
        }
        // Přidej studenta
        dayShifts.push({empId:student.id, start:cfg.eveningStart, end:cfg.eveningEnd});
      }
    }

    // Ulož směny
    if(dayShifts.length>0){
      shifts[date]=dayShifts;
    }
  }

  const newHistory={...(history||{}),[monthKey]:{...(weHistory||{}),...weCount}};
  return {shifts,newHistory};
}

function editDay(date){

  const dayName=DAYS_FULL[dow];
  const [yr,mo,d]=date.split("-");

  function renderModal(){
    const current=genPreview.shifts[date]||[];
    const TYPE_COLOR={senior:"var(--gold)",junior:"var(--wine)",brigadnik:"var(--muted)",student:"#2e7d32"};
    const TYPE_ICON={senior:"☀️",junior:"🌙",brigadnik:"🌙",student:"🎓"};

    document.getElementById("modal-day-box").innerHTML=`
    <div class="modal-header">
      <div class="modal-title">${dayName} ${parseInt(d)}. ${["","Led","Úno","Bře","Dub","Kvě","Čvn","Čvc","Srp","Zář","Říj","Lis","Pro"][parseInt(mo)]}</div>
      <button class="modal-close" onclick="closeModal('modal-day')">✕</button>
    </div>
    <div style="margin-bottom:14px;">
      <div style="font-size:10px;letter-spacing:3px;color:var(--muted);margin-bottom:8px;">AKTUÁLNÍ SMĚNA</div>
      ${current.length===0?`<div style="color:var(--muted);font-style:italic;font-size:13px;">Žádní lidé</div>`:""}
      ${current.map((s,i)=>{
        const emp=emps.find(e=>e.id===s.empId);
        const isMorn=s.start===genCfg.morningStart;
        const icon=emp?.type==="senior"?"☀️":emp?.type==="student"?"🎓":isMorn?"🌤":"🌙";
        return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;padding:8px 10px;background:#fafafa;border-radius:6px;border:1px solid var(--creamD);">
          <span>${icon}</span>
          <span style="flex:1;font-family:'Playfair Display',serif;font-weight:600;color:var(--charcoal);">${emp?.name||"?"}</span>
          <span style="font-size:12px;color:var(--muted);">${s.start}–${s.end}</span>
          <button onclick="removeFromDay('${date}',${i})" style="background:var(--brick);border:none;border-radius:4px;padding:3px 8px;color:#fff;cursor:pointer;font-size:11px;">✕</button>

      }).join("")}

    <div>
      <div style="font-size:10px;letter-spacing:3px;color:var(--muted);margin-bottom:8px;">PŘIDAT ZAMĚSTNANCE</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px;">
        ${emps.filter(e=>!current.some(s=>s.empId===e.id)).map(e=>`
        <button onclick="addToDay('${date}','${e.type==='senior'||e.type==='junior'?genCfg.morningStart:genCfg.eveningStart}','${genCfg.eveningEnd}',${e.id})" 
          style="background:#fff;border:1px solid var(--creamD);border-radius:6px;padding:8px;cursor:pointer;text-align:left;font-family:'Cormorant Garamond',serif;">
          <div style="font-weight:700;font-size:13px;color:var(--charcoal);">${e.name.split(" ").pop()}</div>
          <div style="font-size:10px;color:var(--muted);">${e.role||e.type}</div>

    const timeType=document.querySelector('input[name="addTime"]:checked')?.value;

    genPreview.shifts[date].push({empId,start,end:genCfg.eveningEnd});

  renderModal();

async function saveDayNote(date){
  const note=document.getElementById("day-note-input")?.value.trim()||"";
  const notes={...(appData.shiftNotes||{})};
  if(note) notes[date]=note;
  else delete notes[date];
  const next={...appData,shiftNotes:notes};
  appData=next; await saveData(next);
  showToast("Poznámka uložena ✦");
  closeModal("modal-day");
  renderShiftsTab();
}

function toggleDayOff(date){
  if(!genSelEmp) return;
  const curr=genDaysOff[genSelEmp]||[];
  genDaysOff={...genDaysOff,[genSelEmp]:curr.includes(date)?curr.filter(d=>d!==date):[...curr,date]};
  renderShiftsTab();
}
async function approveDayOff(empId,date){
  const appr={...(appData.daysOffApproved||{})};
  const rej={...(appData.daysOffRejected||{})};
  appr[empId]=[...new Set([...(appr[empId]||[]),date])];
  rej[empId]=(rej[empId]||[]).filter(d=>d!==date);
  const next={...appData,daysOffApproved:appr,daysOffRejected:rej};
  appData=next; await saveData(next); showToast("Schváleno ✓"); renderShiftsTab();
}
async function rejectDayOff(empId,date){
  const appr={...(appData.daysOffApproved||{})};
  const rej={...(appData.daysOffRejected||{})};
  rej[empId]=[...new Set([...(rej[empId]||[]),date])];
  appr[empId]=(appr[empId]||[]).filter(d=>d!==date);
  const next={...appData,daysOffApproved:appr,daysOffRejected:rej};
  appData=next; await saveData(next); showToast("Zamítnuto ✕"); renderShiftsTab();
}

function toggleStudentDay(date){
  genStudentDays=genStudentDays.includes(date)
    ?genStudentDays.filter(d=>d!==date)
    :[...genStudentDays,date];
  renderShiftsTab();
}

function toggleLiborDay(date){
  genLiborDays=genLiborDays.includes(date)
    ?genLiborDays.filter(d=>d!==date)
    :[...genLiborDays,date];
  renderShiftsTab();
}

function toggleEventDay(date){
  const cur = genEventTypes[date]||"none";
  // Cyklus: none → lunch → evening → both → none
  if(cur==="none"){
    genEventTypes[date]="lunch";
    if(!genEventDays.includes(date)) genEventDays=[...genEventDays,date];
  } else if(cur==="lunch"){
    genEventTypes[date]="evening";
  } else if(cur==="evening"){
    genEventTypes[date]="both";
  } else {
    genEventTypes[date]="none";
    genEventDays=genEventDays.filter(d=>d!==date);
    delete genEventLunchExtra[date];
  }
  renderShiftsTab();
}

function runGenerate(){
  // Žádosti o volno: z portálu jen SCHVÁLENÉ + ruční zadání adminem
  const portalDaysOff=appData.daysOff||{};
  const approved=appData.daysOffApproved||{};
  const mergedDaysOff={};
  (appData.employees||[]).forEach(e=>{
    const portalAll=portalDaysOff[e.id]||[];
    const approvedDays=approved[e.id]||[];
    // Z portálu bereme jen schválené dny
    const portalApproved=portalAll.filter(d=>approvedDays.includes(d));
    const admin=genDaysOff[e.id]||[];
    mergedDaysOff[e.id]=[...new Set([...portalApproved,...admin])];
  });
  const result=generateMonthShifts(
    appData.employees||[], genYear, genMonth,
    {...genCfg, eventDays:genEventDays, eventTypes:genEventTypes, studentDays:genStudentDays, liborDays:genLiborDays, eventLunchExtra:genEventLunchExtra},
    mergedDaysOff, appData.shiftHistory||{}
  );
  genPreview=result;
  renderShiftsTab();
  setTimeout(()=>document.getElementById("tab-shifts").querySelector(".btn-gold")?.scrollIntoView({behavior:"smooth"}),100);
}

async function applyShifts(){
  if(!genPreview) return;
  const monthKey=`${genYear}-${String(genMonth).padStart(2,"0")}`;
  const kept={};
  Object.entries(appData.shifts||{}).forEach(([k,v])=>{ if(!k.startsWith(monthKey)) kept[k]=v; });
  const next={...appData,shifts:{...kept,...genPreview.shifts},shiftHistory:genPreview.newHistory};
  appData=next; await saveData(next);
  genPreview=null; genDaysOff={}; genEventDays=[]; genStudentDays=[];
  showToast("Rozpis uložen ✦");
  // Zobraz uložený rozpis jako náhled
  genPreview={shifts:{...appData.shifts},newHistory:appData.shiftHistory||{}};
  renderShiftsTab();
}

async function deleteMonthShifts(){
  const monthKey=`${genYear}-${String(genMonth).padStart(2,"0")}`;
  const MONTHS_CZ2=["Leden","Únor","Březen","Duben","Květen","Červen","Červenec","Srpen","Září","Říjen","Listopad","Prosinec"];
  if(!confirm(`Smazat celý rozpis pro ${MONTHS_CZ2[genMonth-1]} ${genYear}?`)) return;
  const kept={};
  Object.entries(appData.shifts||{}).forEach(([k,v])=>{ if(!k.startsWith(monthKey)) kept[k]=v; });
  const next={...appData,shifts:kept};
  appData=next; await saveData(next);
  showToast("Rozpis smazán"); renderShiftsTab();
}

function exportShiftsExcel(){
  const shiftsToExport=genPreview?genPreview.shifts:appData.shifts||{};
  const monthKey=`${genYear}-${String(genMonth).padStart(2,"0")}`;
  const employees=appData.employees||[];
  const getEmp=id=>employees.find(e=>e.id===id)||{name:"?",type:"junior"};
  const daysInMonth=new Date(genYear,genMonth,0).getDate();
  const DAYS_FULL=["Neděle","Pondělí","Úterý","Středa","Čtvrtek","Pátek","Sobota"];
  const MONTHS_FULL=["Leden","Únor","Březen","Duben","Květen","Červen","Červenec","Srpen","Září","Říjen","Listopad","Prosinec"];
  const TYPE_LABEL={senior:"Senior",junior:"Junior",brigadnik:"Brigádník",student:"Student"};

  const rows=[];
  rows.push([`GRAND CRU — Rozpis směn: ${MONTHS_FULL[genMonth-1]} ${genYear}`,"","","","","","","",""]);
  rows.push([]);
  rows.push(["Datum","Den","Jméno","Typ","Od","Do","Poznámka"]);

  for(let day=1;day<=daysInMonth;day++){
    const date=`${genYear}-${String(genMonth).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
    const dow=new Date(date).getDay();
    const dayShifts=shiftsToExport[date]||[];
    const isFri=dow===5, isSat=dow===6, isSun=dow===0;

    if(dayShifts.length===0){
      rows.push([date,DAYS_FULL[dow],"—","","","",""]);
    } else {
      dayShifts.forEach((s,i)=>{
        const emp=getEmp(s.empId);
        const isSenior=emp.type==="senior";
        rows.push([
          i===0?date:"",
          i===0?DAYS_FULL[dow]:"",
          emp.name,
          TYPE_LABEL[emp.type]||emp.type,
          s.start,
          s.end,
          isSenior?"Celý den":(isFri||isSat)?"Pátek/Sobota":isSun?"Neděle":""
        ]);
      });
    }
    // Prázdný řádek mezi dny pro přehlednost
    rows.push(["","","","","","",""]);
  }

  const wb=XLSX.utils.book_new();
  const ws=XLSX.utils.aoa_to_sheet(rows);
  ws["!cols"]=[{wch:14},{wch:12},{wch:24},{wch:12},{wch:8},{wch:8},{wch:16}];

  // Tučná hlavička
  if(ws["A1"]) ws["A1"].s={font:{bold:true,sz:13}};

  XLSX.utils.book_append_sheet(wb,ws,`${MONTHS_FULL[genMonth-1]} ${genYear}`);
  XLSX.writeFile(wb,`GrandCru_smeny_${genYear}_${String(genMonth).padStart(2,"0")}.xlsx`);
  showToast("Excel stažen ✦");
}

// ══════════════════════════════════════════════════════
function openModal(id){ document.getElementById(id).classList.add("open"); }
function closeModal(id){ document.getElementById(id).classList.remove("open"); }
// Close on bg click
document.addEventListener("click", e=>{
  if(e.target.classList.contains("modal-bg")) e.target.classList.remove("open");
});

// ══════════════════════════════════════════════════════
// TOAST
// ══════════════════════════════════════════════════════
function showToast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.style.display="block";
  setTimeout(()=>t.style.display="none",2500);
}

// ══ HODINY ══
function calcHours(start,end){
  if(!start||!end) return 0;
  const [sh,sm]=start.split(":").map(Number);
  let [eh,em]=end.split(":").map(Number);
  if(eh===0&&em===0) eh=24;
  return Math.max(0,(eh*60+em-sh*60-sm)/60);
}
function getMonthHours(empId,year,month){
  const prefix=`${year}-${String(month).padStart(2,"0")}`;
  let total=0;
  Object.entries(appData.shifts||{}).forEach(([date,shifts])=>{
    if(!date.startsWith(prefix)) return;
    shifts.forEach(s=>{ if(s.empId===empId) total+=calcHours(s.start,s.end); });
  });
  return total;
}
let overviewYear=new Date().getFullYear(), overviewMonth=new Date().getMonth()+1;
function changeOverviewMonth(delta){
  if(delta===0){ overviewYear=new Date().getFullYear(); overviewMonth=new Date().getMonth()+1; }
  else{ overviewMonth+=delta; if(overviewMonth>12){overviewMonth=1;overviewYear++;} if(overviewMonth<1){overviewMonth=12;overviewYear--;} }
  renderOverview();
}
function exportHoursExcel(yr,mo){
  const MF=["Leden","Únor","Březen","Duben","Květen","Červen","Červenec","Srpen","Září","Říjen","Listopad","Prosinec"];
  const empH=[...(appData.employees||[])].map(e=>({...e,hours:getMonthHours(e.id,yr,mo)})).filter(e=>e.hours>0).sort((a,b)=>b.hours-a.hours);
  const rows=[[`GRAND CRU — Hodiny: ${MF[mo-1]} ${yr}`,"","",""],[],["Jméno","Pozice","Typ","Hodiny"]];
  empH.forEach(e=>rows.push([e.name,e.role||"",e.type||"",e.hours]));
  rows.push([],["CELKEM","","",empH.reduce((s,e)=>s+e.hours,0)]);
  const wb=XLSX.utils.book_new();
  const ws=XLSX.utils.aoa_to_sheet(rows);
  ws["!cols"]=[{wch:24},{wch:20},{wch:12},{wch:12}];
  XLSX.utils.book_append_sheet(wb,ws,`${MF[mo-1]} ${yr}`);
  XLSX.writeFile(wb,`GrandCru_hodiny_${yr}_${String(mo).padStart(2,"0")}.xlsx`);
  showToast("Excel stažen ✦");
}
