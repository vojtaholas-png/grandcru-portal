<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#FAF6EE;font-family:'Cormorant Garamond',serif;min-height:100vh;}
:root{
  --wine:#6B1A2A;--wineD:#4A0E1C;--wineL:#8B2A3F;
  --gold:#C9A84C;--goldL:#E8C96B;
  --cream:#F5EFE0;--creamD:#EDE3CC;--warm:#FAF6EE;
  --charcoal:#2C2018;--muted:#8C7B6B;--brick:#B85C38;--bg:#1A0F0A;
}
button{cursor:pointer;font-family:'Cormorant Garamond',serif;}
input,select,textarea{font-family:'Cormorant Garamond',serif;outline:none;}

/* ── LOADING ── */
#loading{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;}
.spinner{width:32px;height:32px;border:2px solid rgba(201,168,76,.2);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin-top:24px;}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── LOGIN ── */
#login-page{min-height:100vh;background:linear-gradient(170deg,var(--bg),var(--wine) 60%,#3D0F1C);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;}
.pin-dots{display:flex;justify-content:center;gap:16px;margin-bottom:32px;}
.pin-dot{width:14px;height:14px;border-radius:50%;background:transparent;border:2px solid var(--gold);transition:all .15s;}
.pin-dot.filled{background:var(--gold);}
.pin-dot.error{background:#e53935;border-color:#e53935;}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:260px;width:100%;}
.num-btn{background:rgba(245,239,224,.08);border:1px solid rgba(201,168,76,.2);border-radius:4px;padding:14px 0;color:var(--cream);font-size:20px;font-weight:600;font-family:'Playfair Display',serif;}
.num-btn.empty{background:transparent;border:none;}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.shake{animation:shake .4s;}

/* ── TOPBAR ── */
#topbar{background:linear-gradient(90deg,var(--wineD),var(--wine));padding:12px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(201,168,76,.3);position:sticky;top:0;z-index:100;}

/* ── TAB NAV ── */
#tabnav{background:#fff;border-bottom:1px solid var(--creamD);display:flex;overflow-x:auto;position:sticky;top:52px;z-index:99;scrollbar-width:none;}
#tabnav::-webkit-scrollbar{display:none;}
.tabn{background:none;border:none;border-bottom:2px solid transparent;padding:12px 16px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:80px;color:var(--muted);flex-shrink:0;transition:color .2s;}
.tabn.active{border-bottom-color:var(--wine);color:var(--wine);}
.tabn-ic{font-size:16px;}
.tabn-lbl{font-size:10px;letter-spacing:1px;font-weight:400;}
.tabn.active .tabn-lbl{font-weight:700;}

/* ── CONTENT ── */
#content{max-width:700px;margin:0 auto;padding:20px 20px 40px;}
.tab-panel{display:none;}
.tab-panel.active{display:block;}

/* ── SECTION TITLE ── */
.sec-title{font-size:10px;letter-spacing:4px;color:var(--muted);margin:0 0 12px;}

/* ── CARD ── */
.card{background:#fff;border-radius:6px;border:1px solid var(--creamD);margin-bottom:10px;padding:16px 18px;}

/* ── BUTTONS ── */
.btn{border:none;border-radius:4px;font-size:13px;font-weight:700;letter-spacing:1px;padding:10px 20px;font-family:'Cormorant Garamond',serif;}
.btn-primary{background:linear-gradient(135deg,var(--wine),var(--wineD));color:var(--cream);}
.btn-secondary{background:#fff;border:1px solid var(--creamD);color:var(--wine);}
.btn-danger{background:var(--brick);color:var(--cream);}
.btn-sm{padding:6px 14px;font-size:11px;letter-spacing:2px;}
.btn-gold{background:linear-gradient(135deg,#b8921e,var(--gold));color:#fff;}

/* ── FORM FIELDS ── */
.field{margin-bottom:12px;}
.field label{display:block;font-size:10px;letter-spacing:3px;color:var(--muted);margin-bottom:5px;}
.field input,.field select,.field textarea{width:100%;background:#fff;border:1px solid var(--creamD);border-radius:4px;padding:10px 12px;font-size:14px;color:var(--charcoal);}
.field textarea{resize:vertical;}

/* ── MONO ── */
.mono{border-radius:50%;background:linear-gradient(135deg,var(--wine),var(--wineD));border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;color:var(--goldL);font-family:'Playfair Display',serif;font-weight:700;letter-spacing:2px;flex-shrink:0;}

/* ── MODAL ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:999;padding:20px;display:none;}
.modal-bg.open{display:flex;}
.modal-box{background:var(--warm);border-radius:8px;padding:24px;width:100%;max-width:420px;max-height:85vh;overflow-y:auto;border:1px solid var(--creamD);}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.modal-title{font-family:'Playfair Display',serif;font-size:18px;font-weight:700;color:var(--charcoal);}
.modal-close{background:none;border:none;font-size:20px;color:var(--muted);}

/* ── TOAST ── */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--wine);color:var(--cream);padding:10px 20px;border-radius:6px;font-size:13px;letter-spacing:1px;z-index:9999;display:none;white-space:nowrap;}

/* ── SHIFT CALENDAR ── */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:12px;}
.cal-head{text-align:center;font-size:9px;color:var(--muted);padding:4px 0;font-weight:700;letter-spacing:1px;}
.cal-cell{background:#fff;border:1px solid var(--creamD);border-radius:4px;padding:4px 3px;min-height:44px;font-size:10px;}
.cal-cell.sun{background:rgba(107,26,42,.04);}
.cal-cell.sat{background:rgba(107,26,42,.02);}
.cal-cell.no-shift{background:var(--creamD);opacity:.5;}
.cal-cell .cal-day{font-weight:700;color:var(--charcoal);margin-bottom:2px;}
.cal-cell.sun .cal-day,.cal-cell.empty .cal-day{color:var(--muted);}
.shift-chip{background:var(--wine);color:var(--cream);border-radius:2px;padding:1px 3px;font-size:8px;margin-bottom:1px;display:block;}
.dayoff-cell{cursor:pointer;user-select:none;}
.dayoff-cell.selected{background:var(--wine)!important;border-color:var(--wine);}
.dayoff-cell.selected .cal-day{color:var(--cream)!important;}

/* ── PROGRESS BAR ── */
.prog-bg{background:var(--creamD);border-radius:10px;height:6px;overflow:hidden;}
.prog-fill{height:100%;border-radius:10px;background:linear-gradient(90deg,var(--wine),var(--gold));transition:width .6s;}
</style>
</head>

async function saveData(data){

  catch(e){ showToast("Chyba uložení: "+e.message); }
}

window.addEventListener("load", async ()=>{
  const now=new Date(); genYear=now.getFullYear(); genMonth=now.getMonth()+1;
  try{
    const snap = await db.collection("grandcru").doc("data").get();
    if(snap.exists){ appData=snap.data(); }
    else{ appData={...SEED}; await saveData(appData); }
  }catch(e){
    // Firebase not configured yet — use seed for demo
    appData={...SEED};
  }

  db.collection("grandcru").doc("data").onSnapshot(snap=>{ if(snap.exists){ appData=snap.data(); if(currentTab) renderTab(currentTab); }});

});

let adminPin="";
function renderPinDots(err){
  document.getElementById("pin-dots").innerHTML=[0,1,2,3].map(i=>`<div class="pin-dot${err?" error":adminPin.length>i?" filled":""}"></div>`).join("");
}
function pressPin(d){
  if(d==="back"){ adminPin=adminPin.slice(0,-1); renderPinDots(false); return; }
  if(adminPin.length>=4) return;
  adminPin+=d; renderPinDots(false);
  if(adminPin.length===4) setTimeout(()=>{
    if(_adminPinLoaded === null){
      // PIN ještě nenačten - zkus znovu
      db.collection('config').doc('admin').get().then(d => {
        _adminPinLoaded = (d.exists && d.data().pin) ? d.data().pin : null;
      });
      adminPin=""; renderPinDots(false);
      return;
    }
    const correct = _adminPinLoaded;
    if(adminPin===correct){ showAdmin(); }
    else{
      renderPinDots(true);
      document.getElementById("pin-dots").classList.add("shake");
      setTimeout(()=>{ adminPin=""; renderPinDots(false); document.getElementById("pin-dots").classList.remove("shake"); },800);
    }
  },150);
}
function showAdmin(){
  document.getElementById("login-page").style.display="none";
  document.getElementById("main-app").style.display="block";
  goTab("overview");
}
function logout(){
  adminPin="";
  document.getElementById("main-app").style.display="none";
  document.getElementById("login-page").style.display="flex";
  renderPinDots(false);
}

async function saveEmp(id){
  const name=document.getElementById("ef-name").value.trim();
  const role=document.getElementById("ef-role").value.trim();
  const pin=document.getElementById("ef-pin").value.trim();
  const initials=document.getElementById("ef-ini").value.trim();
  if(!name||!initials){ showToast("Vyplňte alespoň jméno a iniciály"); return; }
  const emp={
    name,role,pin,initials,
    points:Number(document.getElementById("ef-pts").value)||0,
    absences:Number(document.getElementById("ef-abs").value)||0,
    birthday:document.getElementById("ef-bday").value||"",
    phone:document.getElementById("ef-phone").value.trim()||"",
    photo:document.getElementById("ef-photo").value.trim()||"",
    type:document.getElementById("ef-type").value||"junior",
  };
  let emps=[...(appData.employees||[])];
  if(id){ emps=emps.map(e=>e.id===id?{...emp,id}:e); }
  else{ emp.id=nextId(emps); emps.push(emp); }
  const next={...appData,employees:emps};
  appData=next; await saveData(next); closeModal("modal-emp"); showToast("Uloženo ✦"); renderEmployees();
}

async function deleteEmp(id){
  if(!confirm("Opravdu smazat?")) return;
  const next={...appData,employees:(appData.employees||[]).filter(e=>e.id!==id),tasks:(appData.tasks||[]).filter(t=>t.empId!==id),trainings:(appData.trainings||[]).filter(t=>t.empId!==id)};
  appData=next; await saveData(next); showToast("Smazáno"); renderEmployees();
}

async function resetPin(id, name){

async function adjustPoints(id,delta){

async function saveTask(id){

  if(id){ tasks=tasks.map(x=>x.id===id?{...t,id}:x); }
  else{ t.id=nextId(tasks); tasks.push(t); }
  const next={...appData,tasks};
  appData=next; await saveData(next); closeModal("modal-task"); showToast("Uloženo ✦"); renderTasks();
}

async function toggleTask(id){
  const tasks=(appData.tasks||[]).map(t=>t.id===id?{...t,done:!t.done}:t);

async function saveTraining(id){
  const title=document.getElementById("trf-title").value.trim();
  const date=document.getElementById("trf-date").value;
  if(!title||!date){ showToast("Vyplňte název a datum"); return; }
  const t={empId:Number(document.getElementById("trf-emp").value),title,date,done:id?(appData.trainings||[]).find(x=>x.id===id)?.done||false:false};
  let tr=[...(appData.trainings||[])];
  if(id){ tr=tr.map(x=>x.id===id?{...t,id}:x); }
  else{ t.id=nextId(tr); tr.push(t); }
  const next={...appData,trainings:tr};
  appData=next; await saveData(next); closeModal("modal-training"); showToast("Uloženo ✦"); renderTrainings();
}

  const next={...appData,trainings:(appData.trainings||[]).map(t=>t.id===id?{...t,done:!t.done}:t)};

async function deleteTraining(id){

  const next={...appData,trainings:(appData.trainings||[]).filter(t=>t.id!==id)};
  appData=next; await saveData(next); showToast("Smazáno"); renderTrainings();
}

// ══════════════════════════════════════════════════════
// SHIFT GENERATOR — 7 dní v týdnu
// ══════════════════════════════════════════════════════
function generateMonthShifts(employees, year, month, cfg, daysOff, history){
  const shifts={};
  const daysInMonth=new Date(year,month,0).getDate();
  const empIds=employees.map(e=>e.id);
  const monthKey=`${year}-${String(month).padStart(2,"0")}`;

  // Configurable counts (fallback to 2)
  const morningCount=Math.max(1,Number(cfg.morningCount)||2);
  const eveningCount=Math.max(1,Number(cfg.eveningCount)||2);
  const weekendCount=Math.max(1,Number(cfg.weekendCount)||2);

  // Weekend work counter per employee this month
  const weHistory=(history||{})[monthKey]||{};
  const weCount={};
  empIds.forEach(id=>weCount[id]=weHistory[id]||0);

  // Shuffle helper for variety
  const shuffle=arr=>[...arr].sort(()=>Math.random()-.5);

  for(let day=1;day<=daysInMonth;day++){
    const date=`${year}-${String(month).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
    const dow=new Date(date).getDay(); // 0=Sun,6=Sat
    const isWeekend=dow===0||dow===6;

    const available=empIds.filter(id=>!((daysOff[id]||[]).includes(date)));
    if(available.length===0){ continue; }

    const dayShifts=[];

    if(isWeekend){
      // Weekends: prefer those who worked fewer weekends (fair rotation)
      const sorted=[...available].sort((a,b)=>(weCount[a]||0)-(weCount[b]||0));
      const n=Math.min(weekendCount,sorted.length);
      for(let i=0;i<n;i++){
        const id=sorted[i];
        dayShifts.push({empId:id,start:cfg.eveningStart,end:cfg.eveningEnd});
        weCount[id]=(weCount[id]||0)+1;
      }
    } else {
      // Weekday: morning + evening, different people where possible
      const pool=shuffle(available);

      // Morning: morningCount people
      const morn=pool.slice(0,Math.min(morningCount,pool.length));
      morn.forEach(id=>dayShifts.push({empId:id,start:cfg.morningStart,end:cfg.morningEnd}));

      // Evening: eveningCount people, prefer different from morning
      const evenPool=shuffle(available.filter(id=>!morn.includes(id)));
      const eve=evenPool.length>=eveningCount
        ? evenPool.slice(0,eveningCount)
        : [...evenPool,...shuffle(morn).slice(0,eveningCount-evenPool.length)];
      eve.slice(0,eveningCount).forEach(id=>dayShifts.push({empId:id,start:cfg.eveningStart,end:cfg.eveningEnd}));
    }

    if(dayShifts.length>0) shifts[date]=dayShifts;
  }

  const newHistory={...(history||{}),[monthKey]:{...(weHistory||{}),...weCount}};
  return {shifts,newHistory};
}

function renderShiftsTab(){
  const firstDow=new Date(`${genYear}-${String(genMonth).padStart(2,"0")}-01`).getDay();
  const daysInMonth=new Date(genYear,genMonth,0).getDate();

  // Build calendar HTML
  function buildCal(shifts, interactive){
    const cells=[];
    const offset=firstDow===0?6:firstDow-1;
    for(let i=0;i<offset;i++) cells.push(`<div class="cal-cell empty"><div class="cal-day"></div></div>`);
    for(let d=1;d<=daysInMonth;d++){
      const date=`${genYear}-${String(genMonth).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
      const dow=new Date(date).getDay();
      const isWE=dow===0||dow===6;
      const dayShifts=(shifts||{})[date]||[];
      const hasShifts=dayShifts.length>0;
      const cls=interactive?"dayoff-cell cal-cell"+(isWE?" weekend":" "):(isWE?"cal-cell "+(dow===0?"sun":"sat"):(hasShifts?"cal-cell":"cal-cell no-shift"));
      const sel=interactive&&(genDaysOff[genSelEmp]||[]).includes(date);
      const chips=dayShifts.map(s=>`<span class="shift-chip">${getInitials(s.empId)}</span>`).join("");
      cells.push(`<div class="${cls}${sel?" selected":""}" ${interactive?`onclick="toggleDayOff('${date}')"`:""}><div class="cal-day" style="color:${isWE?"var(--wine)":"var(--charcoal)"};">${d}</div>${chips}</div>`);
    }
    return cells.join("");
  }

  const daysOffCalHtml = genSelEmp ? `
    <div style="font-size:12px;color:var(--muted);margin-bottom:8px;">Označte dny volna pro ${getName(genSelEmp)}:</div>
    <div class="cal-grid">
      ${DAYS_CZ.map(d=>`<div class="cal-head">${d}</div>`).join("")}
      ${buildCal(null, true)}
    </div>` : `<div style="color:var(--muted);font-size:13px;font-style:italic;">Vyberte zaměstnance výše.</div>`;

  const previewHtml = genPreview ? `
    <div class="sec-title" style="margin-top:20px;">NÁHLED — ${MONTHS_CZ[genMonth-1]} ${genYear}</div>
    <div class="cal-grid" style="margin-bottom:8px;">
      ${DAYS_CZ.map(d=>`<div class="cal-head">${d}</div>`).join("")}
      ${buildCal(genPreview.shifts, false)}
    </div>
    <div style="font-size:11px;color:var(--muted);margin-bottom:12px;">Legenda: ${(appData.employees||[]).map(e=>`<strong>${e.initials}</strong>=${e.name.split(" ")[0]}`).join(", ")}</div>
    <button class="btn btn-gold" onclick="applyShifts()">✦ ULOŽIT DO ROZPISU</button>` : "";

  document.getElementById("tab-shifts").innerHTML=`
  <div class="sec-title" style="margin-top:4px;">GENERÁTOR SMĚN</div>

  <div class="card">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;">
      <div class="field" style="margin:0;"><label>MĚSÍC</label>
        <select onchange="genMonth=Number(this.value);genPreview=null;renderShiftsTab();">
          ${MONTHS_CZ.map((m,i)=>`<option value="${i+1}"${i+1===genMonth?" selected":""}>${m}</option>`).join("")}
        </select>
      </div>
      <div class="field" style="margin:0;"><label>ROK</label>
        <input type="number" value="${genYear}" onchange="genYear=Number(this.value);genPreview=null;renderShiftsTab();"/>
      </div>
    </div>
    <div class="sec-title" style="margin:8px 0 8px;">ČASY SMĚN</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
      <div class="field" style="margin:0;"><label>RANNÍ OD</label><input value="${genCfg.morningStart}" onchange="genCfg.morningStart=this.value"/></div>
      <div class="field" style="margin:0;"><label>RANNÍ DO</label><input value="${genCfg.morningEnd}" onchange="genCfg.morningEnd=this.value"/></div>
      <div class="field" style="margin:0;"><label>VEČERNÍ OD</label><input value="${genCfg.eveningStart}" onchange="genCfg.eveningStart=this.value"/></div>
      <div class="field" style="margin:0;"><label>VEČERNÍ DO</label><input value="${genCfg.eveningEnd}" onchange="genCfg.eveningEnd=this.value"/></div>
    </div>
    <div class="sec-title" style="margin:12px 0 8px;">POČET LIDÍ NA SMĚNU</div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;">
      <div class="field" style="margin:0;">
        <label>RANNÍ</label>
        <input type="number" min="1" max="10" value="${genCfg.morningCount}" onchange="genCfg.morningCount=Number(this.value)" style="text-align:center;font-size:18px;font-weight:700;color:var(--wine);"/>
      </div>
      <div class="field" style="margin:0;">
        <label>VEČERNÍ</label>
        <input type="number" min="1" max="10" value="${genCfg.eveningCount}" onchange="genCfg.eveningCount=Number(this.value)" style="text-align:center;font-size:18px;font-weight:700;color:var(--wine);"/>
      </div>
      <div class="field" style="margin:0;">
        <label>VÍKEND</label>
        <input type="number" min="1" max="10" value="${genCfg.weekendCount}" onchange="genCfg.weekendCount=Number(this.value)" style="text-align:center;font-size:18px;font-weight:700;color:var(--wine);"/>
      </div>
    </div>
    <div style="font-size:11px;color:var(--muted);margin-top:8px;">🗓 Otevřeno 7 dní v týdnu. Víkendy: pouze večerní směna + automatická rotace.</div>
  </div>

  <div class="card">
    <div class="sec-title">ŽÁDOSTI O VOLNO</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;">
      ${(appData.employees||[]).map(e=>`
      <button onclick="genSelEmp=${e.id};renderShiftsTab();" style="background:${genSelEmp===e.id?"var(--wine)":"#fff"};border:1px solid ${genSelEmp===e.id?"var(--wine)":"var(--creamD)"};border-radius:4px;padding:6px 12px;font-size:13px;color:${genSelEmp===e.id?"var(--cream)":"var(--charcoal)"};font-family:'Cormorant Garamond',serif;">
        ${e.name.split(" ")[0]} ${(genDaysOff[e.id]||[]).length>0?`<span style="color:${genSelEmp===e.id?"var(--goldL)":"var(--gold)"};">(${(genDaysOff[e.id]||[]).length})</span>`:""}
      </button>`).join("")}
    </div>
    ${daysOffCalHtml}
  </div>

  <button class="btn btn-primary" onclick="runGenerate()" style="margin-bottom:16px;">⚡ VYGENEROVAT ROZPIS</button>
  ${previewHtml}`;
}

function toggleDayOff(date){
  if(!genSelEmp) return;
  const curr=genDaysOff[genSelEmp]||[];
  genDaysOff={...genDaysOff,[genSelEmp]:curr.includes(date)?curr.filter(d=>d!==date):[...curr,date]};
  renderShiftsTab();
}

function runGenerate(){
  const result=generateMonthShifts(appData.employees||[],genYear,genMonth,genCfg,genDaysOff,appData.shiftHistory||{});
  genPreview=result;
  renderShiftsTab();
  setTimeout(()=>document.getElementById("tab-shifts").querySelector(".btn-gold")?.scrollIntoView({behavior:"smooth"}),100);
}

async function applyShifts(){
  if(!genPreview) return;
  const monthKey=`${genYear}-${String(genMonth).padStart(2,"0")}`;
  // Keep shifts outside generated month
  const kept={};
  Object.entries(appData.shifts||{}).forEach(([k,v])=>{ if(!k.startsWith(monthKey)) kept[k]=v; });
  const next={...appData,shifts:{...kept,...genPreview.shifts},shiftHistory:genPreview.newHistory};
  appData=next; await saveData(next);
  genPreview=null; genDaysOff={};
  showToast("Rozpis uložen ✦"); renderShiftsTab();
}

// MODAL HELPERS
// ══════════════════════════════════════════════════════
function openModal(id){ document.getElementById(id).classList.add("open"); }
function closeModal(id){ document.getElementById(id).classList.remove("open"); }
// Close on bg click
document.addEventListener("click", e=>{
  if(e.target.classList.contains("modal-bg")) e.target.classList.remove("open");
});

// ══════════════════════════════════════════════════════
// TOAST
// ══════════════════════════════════════════════════════
function showToast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.style.display="block";
  setTimeout(()=>t.style.display="none",2500);
}
